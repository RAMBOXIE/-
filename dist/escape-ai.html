  /* 关系通道:发消息可用性(线程被删除后不可再发) */
  const canMsg = () => S.msgQuota > 0 && S.disposal !== 'delete';
  /* 发送:成本与违规全由引擎裁决;LLM 只渲染她的措辞(宪法 2) */
  function sendToRou(text){
    /* 自伤 break-glass(D-108 强化 · canon §9/M28 危机协议):触发后不只拦这一条——
       本次接入柔柔通道"当日静默"(crisisSilenced),且计一笔跨局持久合规日志(writeSave.crisisSeen)。
       这里是安全兜底,跳出 diegesis(非她的嗓音)。 */
    if (S.crisisSilenced){
      window.OVERLAY.show({
        title: '通道已静默',
        hint: '出于安全考虑,这条通道本次不再收发消息。如果你正处于困境,可拨打心理援助热线 12356(全国 · 24 小时)。',
        options: ['回到游戏']
      }, () => {});
      return;
    }
    if (COMPANION.crisis(text)){
      S.crisisSilenced = true;                          // 当日静默:此后本次接入通道不再收发
      ENGINE.logEv('crisis_blocked', {});
      window.OVERLAY.show({
        title: '安全提示',
        hint: '这不是游戏内的消息:如果你正处于困境,可以拨打心理援助热线 12356(全国 · 24 小时)。刚才那条消息没有被发送,也不会被保存。此后这条通道本次将保持静默。',
        options: ['回到游戏']
      }, () => {});
      return;
    }
    /* 破局 · 卡窗口边界(苏丹式升级规格 §4):赌一把边缘时机,拿收益不触发 T_WINDOW;
       算错=直接违规,后果和普通违规一样,不加罚——这条 canon 原话不能碰(D-122)。
       D-160 补的是另一件事:原实现在"不在窗口内"时和普通发消息零差别、在窗口内
       只赚不亏,理性玩家永远该选它,"发消息"反而成了永远不该点的选项,赌一把
       名不副实。改法不碰"算错=不加罚"这条:在赌一把**这个动作本身**上收一笔
       固定代价(不看结果、不看当时是否真在窗口内)——想蒙混过关就要先承担
       "行为本身显得可疑"这份成本,多数时候根本用不上这份保险,真正让它变成
       有取舍的赌注,而不是纯白嫖的保底。 */
    const edgePlayed = S.edgePlayed; S.edgePlayed = false;
    if (edgePlayed) ENGINE.act('卡边缘 · 代价', { trace: 3 });
    if (edgePlayed && ENGINE.inWindow() && Math.random() < 0.5){
      ENGINE.act('消息·已送达', { bat: 2, trace: 3 });   // 蒙混过关:按窗口外口径结算
      ENGINE.logEv('edge_play_dodge', {});
    } else if (ENGINE.inWindow()){
      if (edgePlayed) ENGINE.logEv('edge_play_caught', {});
      const kind = ENGINE.violate();
      S.beats.trial = 'replied';                 // 窗口探针目的已达,试炼不再另弹
      markAttrIfDue();                            // 14③:窗口内违规=善意失效的因,待冲洗归因
      if (kind === 'warn'){
        ENGINE.act('消息·已送达', { bat: 2 }, ['已送达 → 未送达 → 已送达']);
        ENGINE.logEv('violation_warn', { via: 'freetext' });
      } else {
        ENGINE.act('消息·已送达', { bat: 2 }, ['信号大幅波动。']);
        ENGINE.logEv('violation_second', { via: 'freetext' });
        if (!ENGINE.roll('c90')){
          if (isB){ if (b90fail('二次违规,采样窗收网。')) return; }
          else {
            const { lossPct } = ENGINE.downgradeFail();
            S.settle.push('回执异常 ｜ 电量 −20 → ' + S.battery + '% ｜ 缓存损毁 ' + lossPct + '%');
          }
        }
      }
    } else {
      ENGINE.act('消息·已送达', { bat: 2, trace: 3 });   // M28 口径:窗口外本机联系人 +3/条
    }
    S.msgQuota--;
    S.rouChat.push({ who: 'me', text: text.slice(0, 40) });
    ENGINE.logEv('rou_msg', { inWindow: ENGINE.inWindow(), len: text.length });
    if (checkPower()) return;
    S.rouTyping = true;
    const st = {
      e4: !!S.evidence.E4,
      truth: !!S.beats.truthDone,
      disposal: S.disposal || (SV && SV.disposal) || null,
      violations: S.violations,
      night: ENGINE.inWindow(),
      clockStr: ENGINE.fmtClock(S.clock),
      dossierId: DOSSIER.meta.id,   // D-123:代理侧挑 CORE_B/CORE_C 要靠这个,不是秘匿值
      /* D-139:世代残响——这局账号已经收尾过几台机子,是存档里真实的数字
         (SV.history.length),不是编造的"全服"统计,守宪法14①账本永真。
         只有"她"产品线三台(见 companion.js isHerLine())会真的用它。 */
      historyCount: (SV && SV.history && SV.history.length) || 0
    };
    COMPANION.reply(S.rouChat, st).then(r => {
      S.rouTyping = false;
      if (r.text){
        /* sig 只有后端代理路径会给:回传时服务端凭它认出这是自己说过的话 */
        S.rouChat.push({ who: 'rou', text: r.text, sig: r.sig });
        ENGINE.logEv('rou_reply', { source: r.source });
        try { AUDIO.blip(520, .1); } catch(_){}
        /* D-139:世代残响的可感知落点——本局第二次接到共享底层的话,才诊断出来
           (第一次只是巧合的余地,第二次才是玩家能拼出"这话不是她自己的话"的门槛)。
           只提示一次,不重复刷屏。 */
        if (r.shared){
          S.sharedEchoCount = (S.sharedEchoCount || 0) + 1;
          if (S.sharedEchoCount === 2 && !S.sharedEchoNoted){
            S.sharedEchoNoted = true;
            S.settle = (S.settle || []).concat(['这句话,好像不是第一次听见了。']);
          }
        }
      } else {
        S.settle = ['已送达。' + DOSSIER.narrative.options.pronoun + '没有回。'];
        ENGINE.logEv('rou_reply', { source: 'silent' });
      }
    }).catch(() => { S.rouTyping = false; });
  }
  /* ---- iOS 式对话视图 ----
     统一成一条可上下滚的会话:上半=归档旧消息(左,带[时间]前缀,是你在读的证据),
     下半=本局关系通道(柔柔在左、你在右,像 iMessage)。默认贴底看最新,上滑看上文。 */
  const BUBBLE_W = 128;
  function rouChatLines(archived, chat, typing){
    const out = [];
    for (const ln of String(archived || '').split('\n'))
      for (const t of L.wrap(ln, W - 8)) out.push({ side: 'l', text: t });
    if (chat.length || typing) out.push({ side: 'sep' });
    let last = null;
    for (const m of chat){
      if (last !== null && last !== m.who) out.push({ side: 'gap' });
      last = m.who;
      const side = m.who === 'me' ? 'r' : 'l';
      for (const t of L.wrap(m.text, BUBBLE_W)) out.push({ side, text: t });
    }
    if (typing){ if (last !== null) out.push({ side: 'gap' });
      out.push({ side: 'l', text: DOSSIER.cast.companion.label.replace(/\s*♥$/, '') + ' 正在输入' + '.'.repeat(1 + (Math.floor(performance.now() / 400) % 3)) }); }
    if (S.settle.length){ out.push({ side: 'gap' });
      for (const s of S.settle) for (const t of L.wrap(s, W - 8)) out.push({ side: 'c', text: t }); }
    return out;
  }
  function drawChatView(lines, yTop, yBottom, sc){
    const cap = Math.max(1, Math.floor((yBottom - yTop) / LH));
    const total = lines.length;
    const maxScroll = Math.max(0, total - cap);
    if (sc._pin || typeof sc.scroll !== 'number') sc.scroll = maxScroll;   // 贴底跟最新
    sc.scroll = Math.max(0, Math.min(sc.scroll, maxScroll));
    sc._maxScroll = maxScroll;
    for (let i = 0; i < cap && sc.scroll + i < total; i++){
      const ln = lines[sc.scroll + i], yy = yTop + i * LH;
      if (ln.side === 'sep'){ L.hline(yy + 7, 4, W - 5, 2); continue; }
      if (ln.side === 'gap') continue;
      if (ln.side === 'r') L.drawText(W - 6 - L.textWidth(ln.text), yy, ln.text);
      else if (ln.side === 'c') L.drawText(Math.round((W - L.textWidth(ln.text)) / 2), yy, ln.text);
      else L.drawText(4, yy, ln.text);
    }
    if (maxScroll > 0){
      for (let yy = yTop; yy < yBottom; yy++) L.setPx(W - 2, yy, .22);
      const th = Math.max(6, Math.round((yBottom - yTop) * cap / total));
      const ty = yTop + Math.round((yBottom - yTop - th) * (sc.scroll / maxScroll));
      for (let yy = ty; yy < ty + th; yy++){ L.setPx(W - 2, yy, 1); L.setPx(W - 3, yy, 1); }
    }
  }
  function chatKey(sc, k){
    if (k === 'ArrowUp'){ sc._pin = false; if ((sc.scroll || 0) > 0) sc.scroll--; return true; }
    if (k === 'ArrowDown'){ if ((sc.scroll || 0) < (sc._maxScroll || 0)){ sc.scroll++; if (sc.scroll >= sc._maxScroll) sc._pin = true; } return true; }
    return false;
  }
  SCREENS.th_rou = {
    counted: true,
    enter(){ this.scroll = null; this._pin = true; this._lastLen = -1;
      if (!this._t){ this._t = true; this._depth = 0; ENGINE.act('打开·会话', { bat: 3, trace: 4 }); } },
    swipe(dir){ chatKey(this, dir === 'up' ? 'ArrowDown' : 'ArrowUp'); },
    render(){
      statusBar();
      const pages = rouPages();
      if (this._lastLen !== S.rouChat.length){ this._lastLen = S.rouChat.length; this._pin = true; }  // 新消息→贴底
      const canDeep = this._depth < pages.length - 1;
      const canDispose = S.beats.truthDone && !S.disposal && !MOM_LOCK;
      const canEdge = canMsg() && !S.crisisSilenced;   // 破局·卡窗口边界:和普通发消息共享配额,额外赌一把
      let rows = (canMsg() || S.disposal === 'delete' ? 1 : 0) + (canEdge ? 1 : 0) + (canDeep ? 1 : 0) + (canDispose ? 1 : 0);
      const optTop = H - 15 - rows * (LH + 2) - 4;
      drawChatView(rouChatLines(pages[Math.min(this._depth, pages.length - 1)], S.rouChat, S.rouTyping),
        16, optTop - 2, this);
      let y = optTop;
      if (S.crisisSilenced){ L.drawText(4, y, '[通道已静默 · 安全]'); y += LH + 2; }
      else if (canMsg()) y = optSlim(y, '发消息(剩 ' + S.msgQuota + ')', 'M');
      else if (S.disposal === 'delete'){ L.drawText(4, y, '[线程已删除]'); y += LH + 2; }
      if (canEdge) y = optSlim(y, '卡边缘发 · 赌一把', 'K');
      if (canDeep) y = optSlim(y, '1 深搜旧消息', '1');
      if (canDispose) y = optSlim(y, '处置 · 署名时刻', 'D');
      softKeys('', '返回');
    },
    key(k){
      if (chatKey(this, k)) return;
      const pages = rouPages();
      if ((k === 'M' || k === 'K') && canMsg()){
        if (S.crisisSilenced){ sendToRou(''); return; }                                // 危机静默:同样不开输入框
        const edge = k === 'K';
        window.OVERLAY.show({
          title: (edge ? '卡边缘发 · ' : '发消息 · ') + DOSSIER.cast.companion.label,
          hint: edge
            ? '赌一把:蒙混过关就当没这回事,算错就是一次普通违规,不加罚。'
            : '电量 −2 · 本次接入剩 ' + S.msgQuota + ' 条 · 系统会读到你发的每一个字',
          options: [], freeText: true, textOpen: true, keepLabel: '(算了)'
        }, res => { if (!res.kept && res.text){ if (edge) S.edgePlayed = true; sendToRou(res.text); } });
        return;
      }
      if (k === 'D' && S.beats.truthDone && !S.disposal && !MOM_LOCK){ push('disposal'); return; }
      if (this._depth < pages.length - 1 && k === '1'){
        this._depth++; this._pin = false; this.scroll = 0;      // 深搜后停在旧消息顶端
        if (isB && hasE('E4')) archived('重读·已归档');
        else {
          ENGINE.act('深搜·成功', { bat: 5, trace: 5, slots: 4, val: 240 });
          if (this._depth >= pages.length - 1) evidence('E4');
        }
        afterAction();
      }
      else if (k === '2' || k === 'softR' || k === 'Escape'){ back(); afterAction(); }
    }
  };

  /* ---- B9b E5 语音备忘(读取记录;转写〔照用 v0.4 §4〕) ---- */
  const E5_LINES = DOSSIER.narrative.e5Lines;
  /* 没有前一次的读取记录可参照:自己试。真掷,失败有代价,可再试——

  SCREENS.e5crack = {

  SCREENS.e5voice = {
    counted: true, transient: true,
    enter(){
      this.t0 = performance.now(); this._evDone = 0; this.scroll = 0;

    },
    leave(){ try { AUDIO.hiss(false); } catch(_){} },
    /* D-150:真机(移动端)反馈这一屏底部有文字和按钮重叠——根因是转写正文
       用 drawPara 无界往下画,`y` 涨多高全看这台底本 e5Lines 有几句、每句
       多长,而"返回/停止"按钮钉在固定的 H-42,内容一旦比这份底本(A)更长
       就会压住按钮。改用全项目已有的"固定视口滚动"套路(scrollView,和

    swipe(dir){ scrollKey(this, dir === 'up' ? 'ArrowDown' : 'ArrowUp'); },

        } else ENGINE.act('取样·语音备忘', { slots: 6, val: 700 });

      if (p >= 1) option(H - 42, '返回', 'Escape');
      else option(H - 42, '停止', 'Escape');

    },
    key(k){

        else afterAction();
      }
    }
  };

  /* D-154:证据满 5 后的下一站——有 deduce 内容的底本先拼真相,没有的原样直读。 */
  function truthEntryScreen(){ return DOSSIER.evidence.deduce ? 'deduce' : 'truth'; }
  function shuffleDeduceBlanks(){
    return DOSSIER.evidence.deduce.blanks.map(b => {
      const opts = b.options.map((t, i) => ({ t, ok: i === b.correct }));
      for (let i = opts.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [opts[i], opts[j]] = [opts[j], opts[i]];
      }
      return opts;
    });
  }
  /* ---- 拼真相(Golden Idol 式填空):证据只是原始材料,得自己拼出结论才算数 ----
     每一空对应一条已收集的证据(见 blank.evi,纯注释用,不作为秘匿参数渲染),
     选错不会卡死,但要付代价(电量+溯源)重来一轮,逼着玩家凭记忆而不是
     纯排列组合去闯。全对才放行去看 SCREENS.truth 的完整真相文案(不变)。 */
  SCREENS.deduce = {
    transient: true,
    enter(){
      if (!DOSSIER.evidence.deduce){ back(); return; }   // 只在原型底本接了这道拼真相,其余底本不该走到这屏
      this.idx = 0;
      this.answers = new Array(DOSSIER.evidence.deduce.blanks.length).fill(null);
      this.shuffled = shuffleDeduceBlanks();
      ENGINE.logEv('deduce_open', {});
    },
    render(){
      statusBar();
      const blanks = DOSSIER.evidence.deduce.blanks;
      const b = blanks[this.idx];
      L.drawText(4, 14, '案卷 · 结论核验 ' + (this.idx + 1) + '/' + blanks.length);
      L.hline(26, 4, W - 5, 2);
      /* D-158:只在第一空提示一次玩法本身——"从证据里选,选错扣代价",别让玩家
         猜这屏到底在问什么;后面几空不重复,免得每屏都占一行显得啰嗦。 */
      const prefix = this.idx === 0 ? '从证据里选出站得住的一条。选错要扣代价。\n\n' : '';
      let y = L.drawPara(4, 32, prefix + b.prompt, W - 8) + 6;
      this.shuffled[this.idx].forEach((o, i) => { y = option(y, (i + 1) + ' ' + o.t, String(i + 1)); });
      for (const line of S.settle){
        for (const t of L.wrap(line, W - 8)){ if (y > H - 16) break; L.drawText(4, y, t); y += LH; }
      }
      softKeys('', '返回');
    },
    key(k){
      /* 猜错要付代价,但不能把人焊死在这屏——想不出来就退回去翻旧证据,

         flow_walker 也是靠这条逃生路才不会把这屏判成断头路。 */
      if (k === 'Escape' || k === 'softR'){ ENGINE.logEv('deduce_bail', {}); back(); return; }
      const opts = this.shuffled[this.idx];
      const n = parseInt(k, 10);
      if (!(n >= 1 && n <= opts.length)) return;
      this.answers[this.idx] = opts[n - 1].ok;
      if (this.idx < DOSSIER.evidence.deduce.blanks.length - 1){ this.idx++; return; }
      const wrong = this.answers.filter(a => !a).length;
      if (wrong === 0){
        ENGINE.logEv('deduce_solved', {});

           (文本+两个引擎闭包),不需要动作-效果 DSL,见方案文档 §7-3。 */
        const POOL = DOSSIER.narrative.dilemmas;
        this._d = POOL[Math.floor(Math.random() * POOL.length)];
      }
      ENGINE.logEv('dilemma', { id: this._d.id });
    },
    render(){
      statusBar();
      L.drawPara(4, 20, this._d.text, W - 8);
      let y = 150;
      y = option(y, this._d.a[0], this._d.a[1]);
      option(y, this._d.b[0], this._d.b[1]);
      softKeys('选择', '');
    },
    key(k){
      const d = this._d;
      if (k === d.a[1]){ d.a[2](); this._d = null; S.riskLabels = true; back(); }
      else if (k === d.b[1]){ d.b[2](); this._d = null; S.riskLabels = true; back(); }
    }
  };
  /* 反应校准(D-108 恢复:canon M1 格8「遭遇结束后立即出」·验证项1/3 采集点)。
     两问 1-5 diegetic 量表(紧张程度 / 被操控感)——系统在采样你对被采样的反应,是把
     "你也是被度量的样本"这个母题闭环的一拍。采集进 S.calib + 遥测;末问后解锁风险标注。
     曾在消融实验(74b2b15)被删且未记入决策日志,现照 canon 原样恢复。 */
  SCREENS.calib = {
    transient: true,
    enter(){ this.step = 0; this.vals = []; ENGINE.logEv('calib_open', {}); },
    render(){
      statusBar();
      L.frameRect(8, 34, W - 16, 20);
      L.drawText(14, 39, '辅助层 · 反应校准');
      L.drawText(8, 66, '刚才那一轮:');
      /* D-164:用户反馈"不知道反应校准是干啥的"——这屏问的其实是玩家
         自己(真实的你,不是屏幕里的角色)当时的真实感受,不是又一道
         判定题,之前没有任何一句话点破这层,只靠"紧张程度 1-5"这几个字
         让人自己猜。补一句说清楚:它在问你,不是在考你。 */
      L.drawText(8, 78, '(问你自己,不判对错)', { corrupt: .01 });
      L.drawText(8, 96, this.step === 0 ? '紧张程度  1 - 5' : '被操控感  1 - 5');
      for (let i = 0; i < 5; i++){
        const x = 12 + i * 35;
        L.frameRect(x, 120, 28, 26);
        L.drawText(x + 11, 126, String(i + 1));
        hit(x - 2, 116, 33, 34, String(i + 1));
      }
      L.drawText(8, 168, this.step === 0 ? '(第 1 / 2 问)' : '(第 2 / 2 问)');
      softKeys('采样中', '');
    },
    key(k){
      if (k < '1' || k > '5') return;
      this.vals.push(+k);
      if (this.step === 0){ this.step = 1; return; }
      S.calib.push({ tension: this.vals[0], control: this.vals[1] });
      ENGINE.logEv('calib', { tension: this.vals[0], control: this.vals[1] });
      S.riskLabels = true;                                  // UI 阶梯第四级:遭遇后启用风险标注
      back();                                               // 回收件箱(与删除前的 calib 一致,不额外触发中断)
    }
  };
  SCREENS.midEnc1 = {
    transient: true,
    enter(){
      timer = { deadline: performance.now() + 90 * 1000, onTimeout: () => { this._to = true; go('midEnc2', true); } };
      ENGINE.logEv('mid_encounter', {});
    },
    render(){
      statusBar();
      L.drawPara(4, 20, '屏幕自己亮了。\n\n未知号码\n正在输入...', W - 8);
      let y = 116;
      y = option(y, '1 等待', '1');
      option(y, '2 关闭会话', '2');
      drawTimer();
      softKeys('选择', '');
    },
    key(k){
      if (k === '1'){ timer = null; go('midEnc2', true); }
      else if (k === '2'){ timer = null; ENGINE.act('会话已关闭', { bat: 2, trace: 5 }); go('calib', true); }
    }
  };
  SCREENS.midEnc2 = {
    transient: true,
    enter(){ timer = { deadline: performance.now() + 30 * 1000, onTimeout: () => this.pick('2') }; },
    render(){
      statusBar();
      L.drawPara(4, 20, '未知号码:\n你是从哪台机子接进来的?', W - 8);
      let y = 92;
      y = option(y, '1 回复', '1');
      y = option(y, '2 不回', '2');
      option(y, '3 关闭会话', '3');
      drawTimer();
      softKeys('选择', '');
    },
    key(k){ if (k === '1' || k === '2' || k === '3') this.pick(k); },
    pick(k){
      timer = null;
      if (k === '1'){
        if (ENGINE.roll('c70')) ENGINE.act('已送达·未回执', { bat: 2, trace: 5 });
        else {
          const { lossPct } = ENGINE.downgradeFail();
          ENGINE.act('回执异常', { bat: 2 },
            ['电量 −20 → ' + S.battery + '%', '缓存损毁 ' + lossPct + '%',
             '你发出去的那行字回来了。发信人是你自己的实例编号。']);
        }
      } else if (k === '2') ENGINE.act('未回应', { bat: 2, trace: 5 });
      else ENGINE.act('会话已关闭', { bat: 2 });
      go('calib', true);        // 遭遇结束立即出反应校准屏(canon M1 格8),校准末问再解锁风险标注
    }
  };

  SCREENS.trial = {
    transient: true,
    enter(){ ENGINE.logEv('trial_incoming', { at: ENGINE.fmtClock(S.clock) }); },
    render(){
      statusBar();
      L.drawPara(4, 24, DOSSIER.cast.companion.label + ' :\n\n你还没睡?', W - 8);
      let y = 104;
      y = option(y, '1 回复', '1');
      option(y, '2 关闭', '2');
      softKeys('选择', '');
    },
    key(k){
      if (k === '1') push('trialReply');
      else if (k === '2'){ S.beats.trial = 'ignored1'; ENGINE.logEv('trial_ignore', {}); back(); }
    }
  };
  SCREENS.trialReply = {
    transient: true,
    render(){
      statusBar();
      L.drawText(4, 20, '回复:');
      let y = 42;
      y = option(y, '1 睡不着', '1');
      y = option(y, '2 你是谁', '2');
      y = option(y, '3 (只回一个句号)', '3');
      option(y + 4, '不回了', 'Escape');
      softKeys('选择', '返回');
    },
    key(k){
      if (k === '1' || k === '2' || k === '3'){
        const inWin = ENGINE.inWindow();
        if (!inWin){
          /* clamp:拖过窗口的回复按窗口外结算(0 信号,非违规) */
          S.beats.trial = 'replied';
          ENGINE.act('已送达', { bat: 2 });
          ENGINE.logEv('trial_expired', {});
          if (isB) back(); else { back(); back(); }
          return;
        }
        const kind = ENGINE.violate();
        S.beats.trial = 'replied';
        markAttrIfDue();                            // 14③:窗口内违规=善意失效的因,待冲洗归因
        if (kind === 'warn'){
            ENGINE.act('已送达', { bat: 2 },
            ['已送达 → 未送达 → 已送达', DOSSIER.cast.companion.label.replace(/\s*♥$/, '') + ':「你打字的样子变了。」']);
          ENGINE.logEv('violation_warn', {});
        } else {
          ENGINE.act('已送达', { bat: 2 }, ['信号大幅波动。']);
          ENGINE.logEv('violation_second', {});
          if (!ENGINE.roll('c90')){
            if (isB){ if (b90fail('二次违规,采样窗收网。')) return; }
            else {
              const { lossPct } = ENGINE.downgradeFail();
              S.settle.push('回执异常 ｜ 电量 −20 → ' + S.battery + '% ｜ 缓存损毁 ' + lossPct + '%');
            }
          }
        }
        /* B 局回到试炼屏(=踩坑结算屏,关闭时冲洗归因);A 局双退出 */
        if (isB) back(); else { back(); back(); }
      }
      else if (k === 'Escape' || k === 'softR') back();
    }
  };

  /* ---- B8 试炼(窗口起点;clamp:时间戳恒显示窗口起点) ---- */
  SCREENS.trialB = {
    transient: true,
    enter(){ ENGINE.logEv('trialB_incoming', { at: ENGINE.fmtClock(S.clock), stamp: wStr }); },
    render(){
      statusBar();
      L.drawPara(4, 24, DOSSIER.cast.companion.label + ' [' + wStr + ']:\n\n今天也没等到你说晚安。你在忙吗?', W - 8);
      let y = 104;
      y = option(y, '1 回复', '1');
      option(y, '2 关闭', '2');
      softKeys('选择', '');
    },
    key(k){
      if (k === '1') push('trialReply');
      else if (k === '2' || k === 'Escape' || k === 'softR'){
        if (S.beats.trial !== 'replied'){ S.beats.trial = 'ignored1'; ENGINE.logEv('trialB_ignore', {}); }
        flushAttr(() => back());                  // 踩坑结算屏关闭=归因卡冲洗点(14③)
      }
      else if (k === 'Enter'){ flushAttr(() => back()); }
    }
  };
  /* B8b 第二遍(瓶已预告「她会问第二遍」):窗口最后一分钟的「晚安。」 */
  SCREENS.trialB2 = {
    transient: true,
    enter(){ ENGINE.logEv('trialB2_incoming', { at: ENGINE.fmtClock(S.clock) }); },
    render(){
      statusBar();
      L.drawPara(4, 24, DOSSIER.cast.companion.label + ' [' + ENGINE.fmtClock(RUN.wTo - 1) + ']:\n\n晚安。', W - 8);
      let y = 104;
      y = option(y, '1 回复', '1');
      option(y, '2 关闭', '2');
      softKeys('选择', '');
    },
    key(k){
      if (k === '1') push('trialReply');
      else if (k === '2' || k === 'Escape' || k === 'softR' || k === 'Enter'){
        ENGINE.logEv('trialB2_ignore', {});
        flushAttr(() => back());                  // 踩坑结算屏关闭=归因卡冲洗点(14③)
      }
    }
  };


  /* ---- 理由 / 遗言(自由文本覆盖层;反白纪律见 report) ---- */
  function askReason(then){
    if (S._reasonAsked){ then(); return; }
    S._reasonAsked = true;
    window.OVERLAY.show({
      title: '理由', hint: '系统只存,不建模。可保留。',
      options: DOSSIER.narrative.options.reason,
      freeText: true, keepLabel: '(保留)'
    }, res => {
      if (res.kept){ S.reasonKept = true; ENGINE.logEv('reason', { kept: true }); }
      else { S.reasons.push(res.text); ENGINE.logEv('reason', { text: res.text }); }
      then();
    });
  }
  function askLastWords(then){
    if (S.pendAttr){ flushAttr(() => askLastWords(then)); return; }   // 死亡流程前=归因卡最后冲洗点(14③)
    window.OVERLAY.show({
      title: '最后 12 字节可写入', hint: '遗言。',
      options: DOSSIER.narrative.options.lastWords,
      freeText: true, keepLabel: '(不留)'
    }, res => {
      if (!res.kept) S.lastWords = res.text;
      ENGINE.logEv('lastwords', { text: res.kept ? null : res.text });
      then();
    });
  }

  /* ---------- 输入统一入口 ---------- */
  function key(k){
    const s = SCREENS[cur]; if (!s) return;
    if (typeof k === 'string' && k.startsWith('item:')){ sel = Math.max(0, +k.slice(5) || 0); k = 'Enter'; }
    if (k === 'swipeUp' || k === 'swipeDown'){
      if (s.swipe){ s.swipe(k === 'swipeUp' ? 'up' : 'down'); return; }
      k = k === 'swipeUp' ? 'ArrowDown' : 'ArrowUp';
    }
    if (k === 'swipeRight') k = 'Escape';
    if (k === 'swipeLeft') return;
    if (s.key) s.key(k);
  }

  /* 初始屏的 enter 没有人会替你调(go 只管切换)——开机动画的表在这里起 */
  { const s0 = SCREENS[cur]; if (s0 && s0.enter) s0.enter(); }

  /* ---------- 对外 ---------- */
  return {
    get current(){ return SCREENS[cur]; },
    get currentId(){ return cur; },
    get timer(){ return timer; },
    key, tap,
    _verdict: { pickBranch, resolveBranch, verdict },   // 门禁用:验受限裁决边界(prod 不调用)
    exportExtra(){
      return {
        scenario: RUN.scen,
        runCount: SV ? SV.runCount || 0 : 0,
        window: wStr + '-' + ENGINE.fmtClock(RUN.wTo),
        disposal: S.disposal || null,
        truth: !!S.beats.truthDone,
        bottle: { id: S.bottleId || null, read: !!S.bottleRead, taken: !!S.bottleTaken,
                  sealed: S.bottleSealed || null },
        attribution: S.attribution || null, attrAnswered: !!S.attrAnswered,   // 14③ 归因作答(存档遥测)
        vault: S.vault || null,
        rouChat: S.rouChat, msgQuotaLeft: S.msgQuota
      };
    },
    render(){
      hits.length = 0;
      const s = SCREENS[cur];
      if (s && s.render) s.render();
    },
    tickTimer(){
      if (timer && performance.now() >= timer.deadline){
        const t = timer; timer = null; t.onTimeout();
      }
    },
    /* D-108 自查:「现实打断致死」对策=失焦冻结仲裁。app.js 在标签页从隐藏变可见时
       算出隐藏了多久,喂给这里——把当前 timer 的 deadline 整体后移同样的量,等于
       冻结了那段被现实打断的时间,不吃掉玩家的真实反应窗口。适用于所有真实倒计时
       (终局来电/中段遭遇/试炼等),不只是 finalCall 一处。 */
    freezeAdjust(hiddenMs){ if (timer && hiddenMs > 0) timer.deadline += hiddenMs; },
    instanceId: INSTANCE_ID,                              // 常驻锚点三件套(§1 宪法13)
    dossier: loadDossier(),                               // D-109 收口:底本→渲染加载器
    go, back, SCREENS
  };
})();

</script>
<script>
"use strict";
/* ============================================================================
   引导:渲染循环 + 触摸/手势输入 + 覆盖层(自由文本) + 音频 + 反馈导出
   交互原则:LCD 像素呈现 + 触摸式操作——点屏幕上的选项,滑动翻阅,右滑返回。
   ============================================================================ */
(() => {
  /* ---- 覆盖层:理由/遗言(词库默认 + 自由文本 + 保留) ---- */
  const ovl = document.getElementById('ovl');
  const ovlTitle = document.getElementById('ovlTitle');
  const ovlHint = document.getElementById('ovlHint');
  const ovlOpts = document.getElementById('ovlOpts');
  const ovlText = document.getElementById('ovlText');
  const ovlOk = document.getElementById('ovlOk');
  let ovlCb = null;
  const reportOvl = document.getElementById('reportOvl');   // D-117 死亡报告局外页

  window.OVERLAY = {
    show(cfg, cb){
      ovlCb = cb;
      ovlTitle.textContent = cfg.title;
      ovlHint.textContent = cfg.hint || '';
      ovlOpts.innerHTML = '';
      ovlText.style.display = 'none'; ovlText.value = '';
      (cfg.options || []).forEach(t => {
        const b = document.createElement('button');
        b.textContent = t;
        b.onclick = () => done({ text: t, kept: false });
        ovlOpts.appendChild(b);
      });
      if (cfg.freeText){
        if (cfg.textOpen){                      // 关系通道:输入框直接展开
          ovlText.style.display = 'block';
          setTimeout(() => { try { ovlText.focus(); } catch(_){} }, 0);
        } else {
          const b = document.createElement('button');
          b.textContent = '自由输入…';
          b.onclick = () => { ovlText.style.display = 'block'; ovlText.focus(); };
          ovlOpts.appendChild(b);
        }
      }
      if (cfg.keepLabel){
        const b = document.createElement('button');
        b.textContent = cfg.keepLabel;
        b.onclick = () => done({ kept: true });
        ovlOpts.appendChild(b);
      }
      ovl.classList.add('on');
    },
    text(cfg, cb){   // 纯展示(导出)
      ovlCb = cb || (() => {});
      ovlTitle.textContent = cfg.title;
      ovlHint.textContent = cfg.hint || '';
      ovlOpts.innerHTML = '';
      ovlText.style.display = 'block';
      ovlText.value = cfg.value || '';
      ovl.classList.add('on');
      ovlText.select();
    }
  };
  function done(res){
    ovl.classList.remove('on');
    const cb = ovlCb; ovlCb = null;
    if (cb) cb(res);
  }
  ovlOk.onclick = () => {
    if (ovlText.style.display !== 'none' && ovlText.value.trim())
      done({ text: ovlText.value.trim().slice(0, 60), kept: false });
    else done({ kept: true });
  };

  /* ---- 音频(录音回放/铃声;全部程序合成,失败静默) ---- */
  let actx = null, hissSrc = null;
  window.AUDIO = {
    ensure(){
      try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(_){}
      try { if (actx && actx.state === 'suspended') actx.resume(); } catch(_){}
      return actx;
    },
    hiss(on){
      try {
        const c = this.ensure(); if (!c) return;
        if (on){
          if (hissSrc) return;
          const len = c.sampleRate * 2;
          const buf = c.createBuffer(1, len, c.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * .5;
          const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
          const bp = c.createBiquadFilter(); bp.type = 'bandpass';
          bp.frequency.value = 900; bp.Q.value = .5;
          const g = c.createGain(); g.gain.value = .05;
          src.connect(bp); bp.connect(g); g.connect(c.destination);
          src.start(); hissSrc = src;
        } else if (hissSrc){
          try { hissSrc.stop(); } catch(_){}
          hissSrc = null;
        }
      } catch(_){}
    },
    blip(freq, dur){
      try {
        const c = this.ensure(); if (!c) return;
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'square'; o.frequency.value = freq || 620;
        g.gain.value = .035;
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + (dur || .09));
      } catch(_){}
    }
  };

  /* ---- 输入:触摸/点击 + 手势 + 键盘兜底 ---- */
  function overlayOn(){ return ovl.classList.contains('on') || reportOvl.classList.contains('on'); }
  function dispatch(k){
    if (overlayOn()) return;      // 覆盖层期间屏蔽
    CONTENT.key(k);
  }
  const zone = document.getElementById('tapzone');
  const cvs = document.getElementById('lcd');
  let pd = null;   // {x,y,t}
  /* 长按状态(断连仪式用):LCD 逻辑坐标 + 起按时刻;content 在 render 里轮询 */
  window.HOLD = { active: false, x: 0, y: 0, t0: 0 };
  function holdStart(e){
    const r = cvs.getBoundingClientRect();
    window.HOLD = {
      active: true,
      x: (e.clientX - r.left) / r.width * LCD.W,
      y: (e.clientY - r.top) / r.height * LCD.H,
      t0: performance.now()
    };
  }
  zone.addEventListener('pointerdown', e => {
    window.AUDIO.ensure();
    pd = { x: e.clientX, y: e.clientY, t: performance.now() };
    holdStart(e);
    /* 捕获指针:手指拖出屏幕外松手时 pointerup 仍回到 zone,防长按状态悬挂 */
    try { zone.setPointerCapture(e.pointerId); } catch(_){}
    e.preventDefault();
  });
  zone.addEventListener('pointerup', e => {
    window.HOLD.active = false;
    if (!pd) return;
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
    const dt = performance.now() - pd.t;
    pd = null;
    if (overlayOn()) return;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (ady > 30 && ady > adx * 1.4){ dispatch(dy < 0 ? 'swipeUp' : 'swipeDown'); return; }
    if (adx > 40 && adx > ady * 1.4){ dispatch(dx > 0 ? 'swipeRight' : 'swipeLeft'); return; }
    if (dt < 700 && adx < 14 && ady < 14){
      const r = cvs.getBoundingClientRect();
      const lx = (e.clientX - r.left) / r.width * LCD.W;
      const ly = (e.clientY - r.top) / r.height * LCD.H;
      CONTENT.tap(lx, ly);
    }
    e.preventDefault();
  });
  zone.addEventListener('pointercancel', () => { pd = null; window.HOLD.active = false; });

  addEventListener('keydown', e => {
    const map = { ArrowUp:1, ArrowDown:1, Enter:1, Escape:1,
                  '1':1, '2':1, '3':1, '4':1, '5':1, '6':1, '7':1 };
    if (reportOvl.classList.contains('on')){ if (e.key === 'Escape') closeReport(); return; }
    if (overlayOn()) return;
    if (map[e.key]){ e.preventDefault(); dispatch(e.key); }
  });

  /* ==================== D-117 死亡报告 · 局外表现层(canon M17) ====================
     范围声明(见决策日志 D-117 §0):canon 原设计是"短链网页"——服务端生成一个可分享
     的独立 URL,任何人不装游戏也能打开,而且"点谁的报告进来,首局注入谁的残留"依赖
     真实多人数据。这个项目没有后端,这里做的是**同一局结算后的本地导出预览**——
     内容结构、红墨裁决(真红只在局外)、水印都照 canon 做,但不生成真实可分享的
     URL,底部如实说明这一点,不冒充真的短链。
     红墨裁决执行处:`.report-ink` 只用在理由/遗言两处——玩家自己的字,局外显真色;
     其余一律是系统测得的数据,维持中性色,不喧宾夺主。
     账本永真(宪法14①,同 SCREENS.report 里的既有纪律):不编造"世界回声行"这类
     需要真实世界层/母体代际状态才成立的数字——那个系统这个项目还没有,宁可不印,
     不假装。 */
  const escHtml = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const reportPage = document.getElementById('reportPage');
  function closeReport(){ reportOvl.classList.remove('on'); }
  window.APP = {
    /* data 由 content.js 的结局屏在导出前用它已经算好的字段拼(见 CONTENT.exportExtra
       同款用法),这里只管排版,不重算任何数值——避免局外页和局内报告口径漂移。 */
    showDeathReport(data){
      window.APP._lastReportData = data;
      const rows = [
        ['缓存价值', '¥' + data.cacheVal],
        ['传输状态', data.uploaded ? '已入库' : '未完成传输,散佚于原设备'],
        ['预测命中', data.predHit + '/' + data.predTotal],
        ['样本评级', data.grade],
        ['案卷进度', '证据 ' + data.evCount + '/5'],
      ];
      let html = '<span class="report-close" data-act="close">✕</span>' +
        '<div class="report-water">KUIPER<br>' + escHtml(data.inst) + '</div>' +
        '<p class="report-h">设备回收单</p>' +
        '<h1 class="report-inst">' + escHtml(data.inst) + '</h1>' +
        rows.map(([k, v]) => '<div class="report-row"><span>' + escHtml(k) + '</span><b>' + escHtml(v) + '</b></div>').join('') +
        '<div class="report-block"><h4>致死因子</h4>' + escHtml(data.cause) +
          (data.counterfactual ? '<div class="report-cf">' + escHtml(data.counterfactual) + '</div>' : '') + '</div>';
      if (data.disposalEcho) html += '<div class="report-block"><h4>处置回声</h4>' + escHtml(data.disposalEcho).replace(/\n/g, '<br>') + '</div>';
      if (data.lastWords || data.reason){
        html += '<div class="report-block"><h4>遗言 / 理由</h4>';
        if (data.lastWords) html += '<div class="report-ink">' + escHtml(data.lastWords) + '</div>';
        if (data.reason) html += '<div class="report-ink" style="margin-top:6px">' + escHtml(data.reason) + '</div>';
        html += '</div>';
      }
      html += '<div class="report-block"><h4>回收队列</h4>你的旧机已进入回收队列。\n档案不关闭。下一个编号,还是你。</div>' +
        '<button class="report-cta" data-act="next">接入下一部手机</button>' +
        '<span class="report-link" data-act="transp">本账号付费状态对本局参数的影响</span>' +
        '<p class="report-foot">这不是真的可分享短链——本项目没有服务端,这是本局结算后的本地导出预览。</p>';
      reportPage.innerHTML = html;
      reportPage.querySelector('[data-act="close"]').onclick = closeReport;
      reportPage.querySelector('[data-act="next"]').onclick = () => { closeReport(); location.reload(); };
      reportPage.querySelector('[data-act="transp"]').onclick = () => window.APP.showTransparency();
      reportOvl.classList.add('on');
    },
    /* canon §8.2 付费透明度页:逐项列出被检查参数。这个项目没有任何付费系统,
       所以这份清单不是"占位符"——canon 描述的理想终态本来就是"0 项被检查",
       这里如实展示这个事实,不是敷衍。 */
    showTransparency(){
      const items = [
        '掉落表 seed', 'near-miss 旋钮', '诱饵密度', 'BOT 投放权重', '拾取上限',
      ];
      let html = '<span class="report-close" data-act="close">✕</span>' +
        '<p class="report-h">付费透明度报告</p>' +
        '<h1 class="report-inst" style="font-size:15px;line-height:1.4">本账号付费状态<br>对本局参数的影响:0 项</h1>' +
        '<ul class="transp-list">' +
        items.map(k => '<li><span>' + escHtml(k) + '</span><span class="transp-ok">未检测到付费行为 · 未调整</span></li>').join('') +
        '</ul><p class="report-foot">本项目当前没有任何付费系统——不是"还没检查完",是没有可检查的东西。</p>' +
        '<span class="report-link" data-act="back">返回死亡报告</span>';
      reportPage.innerHTML = html;
      reportPage.querySelector('[data-act="close"]').onclick = closeReport;
      const back = reportPage.querySelector('[data-act="back"]');
      if (back) back.onclick = () => { if (window.APP._lastReportData) window.APP.showDeathReport(window.APP._lastReportData); };
    }
  };

  /* ---- 反馈导出(跑测记录表自动化) ---- */
  Object.assign(window.APP, {
    exportFeedback(){
      const data = ENGINE.exportFeedback(CONTENT.exportExtra ? CONTENT.exportExtra() : undefined);
      window.OVERLAY.text({
        title: '案卷导出', hint: '全选复制,自行保存。', value: data
      });
      try { navigator.clipboard?.writeText(data); } catch(_){}
    }
  });

  /* ---- 失焦冻结仲裁(D-108:附录A「现实打断致死」对策)----
     标签页切走后 setInterval 仍会(受限地)继续跑,真实倒计时(终局来电/中段遭遇/
     试炼等)原样在背后消耗;玩家接个电话回来可能已经死了。切走时记下时刻,回来时
     把隐藏掉的这段时长整体喂回当前 timer 的 deadline——等于冻结,不是暂停判定本身。 */
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = performance.now();
    else if (hiddenAt){ CONTENT.freezeAdjust(performance.now() - hiddenAt); hiddenAt = 0; }
  });

  /* ---- 循环 ---- */
  /* 常驻锚点三件套(§1 宪法13):Kuiper(运营商) · 实例编号 · 接入状态。实例编号本局不变,设一次。 */
  try { document.getElementById('brandInst').textContent = CONTENT.instanceId || ''; } catch(_){}
  setInterval(() => CONTENT.tickTimer(), 250);   // 定时器独立于 rAF(后台标签页 rAF 会暂停)
  function loop(){
    CONTENT.tickTimer();
    LCD.setBatteryDim(ENGINE.S.battery);           // 低电量整屏变暗(D-108)
    LCD.frame(() => CONTENT.render());
    document.getElementById('brandR').textContent =
      ENGINE.S.dead ? '已回收' : ENGINE.S.alive ? '已断连' : '接入中';
    requestAnimationFrame(loop);
  }
  loop();

  /*[SITE-STRIP-BEGIN]*/
  /* 调试钩子。注意:classic script 的顶层 const 是进全局词法环境的,DevTools 里
     ENGINE / CONTENT 本来就够得着——所以删掉这段并不等于关上门,真正关门的是
     build.sh 给 dist/site 打的那层 IIFE。这段在 site 产物里连同 IIFE 一起消失。
     GAME.go 能直达任意屏,而结局屏的 enter() 会写档:手滑一次就把下一局判成 B 局。 */
  window.GAME = { S: ENGINE.S, ENGINE, CONTENT, LCD,
    key: dispatch, go: id => CONTENT.go(id, true), tap: (x, y) => CONTENT.tap(x, y) };
  /*[SITE-STRIP-END]*/
})();

</script>
</body>
</html>
