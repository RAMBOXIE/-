<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>逃离AI · 盲机</title>
<style>
  :root{
    --lcd-lit:#5FF0C8; --lcd-unlit:#14332C; --lcd-substrate:#08130F;
    --lcd-amber:#F2A950;
    --shell:#171a19; --shell-2:#0e100f; --shell-edge:#2c312f;
    --ink:#8d9a95; --ink-dim:#5a6663;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#0a0c0b;color:var(--ink);
    font:13px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,"Microsoft YaHei",monospace;
    -webkit-font-smoothing:antialiased;min-height:100%}
  .wrap{display:flex;align-items:center;justify-content:center;padding:12px 8px;min-height:100dvh}

  .device{width:min(760px,100vw - 8px,100dvh * .8);padding:9px 10px 7px;border-radius:14px;
    background:linear-gradient(180deg,var(--shell) 0%,var(--shell-2) 100%);
    border:1px solid var(--shell-edge);
    box-shadow:0 1px 0 rgba(255,255,255,.045) inset,0 24px 60px -28px #000}
  .brand{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:10px;letter-spacing:.34em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:6px}
  .bezel{position:relative;padding:5px;border-radius:5px;background:#05100c;
    border:1px solid #202826;box-shadow:0 2px 14px rgba(0,0,0,.7) inset}
  .screen-stack{position:relative;line-height:0;touch-action:none;cursor:pointer;user-select:none}
  canvas{display:block;image-rendering:pixelated;width:100%;height:auto}
  .grid{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to right,transparent 0 2px,rgba(3,10,8,.62) 2px 3px),
               repeating-linear-gradient(to bottom,transparent 0 2px,rgba(3,10,8,.62) 2px 3px)}
  .glass{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(115% 85% at 50% 0%,rgba(120,255,220,.055),transparent 60%)}
  .chin{margin-top:6px;text-align:center;font-size:10px;letter-spacing:.42em;color:#39413e}

  /* 自由文本覆盖层(理由/遗言)——反白纪律:玩家的字在屏上以反白呈现 */
  .overlay{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;
    padding-top:9vh;background:rgba(5,10,8,.88);z-index:9}   /* 上对齐:iOS 软键盘弹出时输入框不被盖住 */
  .overlay.on{display:flex}
  .sheet{width:min(430px,92vw);background:#0c1512;border:1px solid #234;border-color:#1f3a31;
    border-radius:8px;padding:20px 18px}
  .sheet h3{margin:0 0 4px;font-size:12px;letter-spacing:.2em;color:var(--lcd-lit);font-weight:400}
  .sheet .hint{font-size:11px;color:#5f6b67;margin:0 0 12px}
  .sheet textarea{width:100%;background:#08130f;border:1px solid #1f3a31;color:var(--lcd-lit);
    font:inherit;font-size:14px;padding:10px;border-radius:4px;min-height:64px;outline:0}
  .sheet .opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .sheet .opts button{appearance:none;text-align:left;border:1px solid #1f3a31;background:transparent;
    color:#8fb8aa;font:inherit;font-size:13px;padding:9px 12px;border-radius:4px;cursor:pointer}
  .sheet .opts button:hover{background:#0f1f1a}
  .sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .sheet .row button{appearance:none;border:1px solid #2c312f;background:#1c201f;color:#9fada8;
    font:inherit;font-size:12px;padding:8px 16px;border-radius:4px;cursor:pointer}
  .sheet .row button.primary{background:#20302b;border-color:#33463f;color:#a8e8d3}

  /* D-117 死亡报告 · 局外表现层(canon M17 短链页 + 红墨裁决"真红只在局外")。
     和上面 .overlay/.sheet(游戏内覆盖层,LCD 逻辑的延伸)刻意分开一套样式——这是
     整个项目里唯一允许出现真实红色的地方,叙事解:降级渲染夺走了颜色,只有在
     你自己的档案里,它才是红的。没有后端,这不是真的可分享短链,是本局结算后
     的本地导出预览(§0 范围声明,见决策日志 D-117)。 */
  .report-overlay{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;
    padding:6vh 12px;background:#000;z-index:10;overflow-y:auto}
  .report-overlay.on{display:flex}
  .report-page{width:min(480px,94vw);background:#fafaf7;color:#1a1a1a;border-radius:2px;
    padding:28px 24px 24px;font:14px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,"Microsoft YaHei",monospace;
    position:relative;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
  .report-page::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.05;
    background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px)}
  .report-water{position:absolute;top:18px;right:20px;font-size:10px;letter-spacing:.18em;
    color:#00000030;text-transform:uppercase;text-align:right}
  .report-h{font-size:12px;letter-spacing:.28em;color:#00000066;text-transform:uppercase;margin:0 0 2px}
  .report-inst{font-size:20px;letter-spacing:.04em;margin:0 0 18px;font-weight:600}
  .report-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
    border-bottom:1px solid #00000014;font-size:13px}
  .report-row b{font-weight:600}
  .report-block{margin:16px 0;padding:14px 14px 12px;background:#00000006;border-radius:2px}
  .report-block h4{margin:0 0 6px;font-size:11px;letter-spacing:.16em;color:#00000066;
    text-transform:uppercase;font-weight:400}
  /* 红墨:只出现在这两处(理由/遗言) */
  .report-ink{color:#a3121f;font-weight:600;white-space:pre-wrap}
  .report-cf{color:#5a5a52;font-style:italic;font-size:12.5px;margin-top:6px}
  .report-cta{display:block;width:100%;margin-top:20px;padding:13px;text-align:center;
    background:#141414;color:#fafaf7;border:0;border-radius:3px;cursor:pointer;
    font:inherit;font-size:13px;letter-spacing:.08em}
  .report-link{display:block;text-align:center;margin-top:10px;font-size:11px;color:#00000066;
    cursor:pointer;text-decoration:underline}
  .report-foot{margin-top:16px;font-size:10.5px;color:#00000055;text-align:center;letter-spacing:.04em}
  .report-close{position:absolute;top:14px;left:16px;font-size:16px;color:#00000055;cursor:pointer}
  .transp-list{margin:0;padding:0;list-style:none}
  .transp-list li{padding:8px 0;border-bottom:1px solid #00000014;font-size:12.5px;
    display:flex;justify-content:space-between;gap:10px}
  .transp-ok{color:#2f6b3f}
</style>
</head>
<body>
<div class="wrap">
  <div class="device">
    <div class="brand"><span>Kuiper</span><span id="brandInst"></span><span id="brandR">连接中</span></div>
    <div class="bezel">
      <div class="screen-stack" id="tapzone">
        <canvas id="lcd" width="588" height="672"></canvas>
        <div class="glass"></div><div class="grid"></div>
      </div>
    </div>
    <div class="chin">欲望算法</div>
  </div>
</div>

<div class="overlay" id="ovl">
  <div class="sheet">
    <h3 id="ovlTitle">理由</h3>
    <p class="hint" id="ovlHint">系统只存,不建模。</p>
    <div class="opts" id="ovlOpts"></div>
    <textarea id="ovlText" placeholder="自由输入…" style="display:none"></textarea>
    <div class="row">
      <button id="ovlCancel" style="display:none">取消</button>
      <button class="primary" id="ovlOk">确定</button>
    </div>
  </div>
</div>

<!-- D-117 死亡报告 · 局外表现层(canon M17)。两页:回收单(报告本体)+ 付费透明度
     (canon:"该页可进死亡报告短链页",做成同一个覆盖层里的第二页,不另开导航)。 -->
<div class="report-overlay" id="reportOvl">
  <div class="report-page" id="reportPage"></div>
</div>

<script>
"use strict";
/* ============================================================================
   盲机 LCD 渲染器(迁自 research/M1_LCD原型,模块化)
   逻辑屏 196×224。潜望镜原则:一切内容——正文、仪表、故障——写进同一个帧缓冲。
   ============================================================================ */
const LCD = (() => {
  const W = 196, H = 224, SCALE = 3;
  const CELL_H = 13, CW_ASC = 6, LINE_H = 15, SS = 4;
  const CJK_FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif';
  const ASC_FONT = 'ui-monospace,"SF Mono",Menlo,Consolas,monospace';

  const cvs = document.getElementById('lcd');
  const ctx = cvs.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const offc = off.getContext('2d');
  const img = offc.createImageData(W, H);

  const target = new Float32Array(W * H);
  const actual = new Float32Array(W * H);
  const px = (x, y) => y * W + x;

  function setPx(x, y, v){ if (x >= 0 && x < W && y >= 0 && y < H) target[px(x, y)] = v; }
  function rect(x, y, w, h, v = 1){ for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) setPx(x + i, y + j, v); }
  function frameRect(x, y, w, h){
    for (let i = 0; i < w; i++){ setPx(x + i, y, 1); setPx(x + i, y + h - 1, 1); }
    for (let j = 0; j < h; j++){ setPx(x, y + j, 1); setPx(x + w - 1, y + j, 1); }
  }
  function hline(y, x0 = 0, x1 = W - 1, step = 1){ for (let x = x0; x <= x1; x += step) setPx(x, y, 1); }
  function disc(cx, cy, r, v = 1){
    const r2 = r * r;
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++)
      if (i * i + j * j <= r2) setPx(cx + i, cy + j, v);
  }
  function ring(cx, cy, r, thick = 2){
    const ro = r * r, ri = (r - thick) * (r - thick);
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++){
      const d = i * i + j * j;
      if (d <= ro && d >= ri) setPx(cx + i, cy + j, 1);
    }
  }
  function invertRect(x, y, w, h){
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++){
      const k = px(x + i, y + j); if (k >= 0 && k < target.length) target[k] = target[k] > .5 ? 0 : 1;
    }
  }

  /* ---- 字形:真字体 → 4× 超采样 → 盒式降采样 → 阈值二值化(阈值=失真参数) ---- */
  const gcan = document.createElement('canvas');
  const gctx = gcan.getContext('2d', { willReadFrequently: true });
  const glyphCache = new Map();
  const isHalf = ch => ch.charCodeAt(0) < 0x2000 && !/[，。、：；「」『』（）？！—·…♥]/.test(ch);
  const cellW = ch => isHalf(ch) ? CW_ASC : CELL_H;

  function glyph(ch){
    const hit = glyphCache.get(ch); if (hit) return hit;
    const cw = cellW(ch), GW = cw * SS, GH = CELL_H * SS;
    gcan.width = GW; gcan.height = GH;
    gctx.clearRect(0, 0, GW, GH);
    gctx.fillStyle = '#fff'; gctx.textAlign = 'center'; gctx.textBaseline = 'alphabetic';
    gctx.font = (isHalf(ch) ? CELL_H * SS * .92 : CELL_H * SS * .98) + 'px ' + (isHalf(ch) ? ASC_FONT : CJK_FONT);
    gctx.fillText(ch, GW / 2, GH * .80);
    const d = gctx.getImageData(0, 0, GW, GH).data;
    const cov = new Float32Array(cw * CELL_H);
    const inv = 1 / (SS * SS * 255);
    for (let y = 0; y < CELL_H; y++) for (let x = 0; x < cw; x++){
      let s = 0;
      for (let j = 0; j < SS; j++){
        const row = (y * SS + j) * GW;
        for (let i = 0; i < SS; i++) s += d[(row + x * SS + i) * 4 + 3];
      }
      cov[y * cw + x] = s * inv;
    }
    const g = { cw, cov }; glyphCache.set(ch, g); return g;
  }

  function textWidth(str){ let w = 0; for (const ch of str) w += (ch === ' ' ? CW_ASC : cellW(ch)); return w; }

  function drawText(x, y, str, o = {}){
    const thr = o.threshold ?? R.threshold, corrupt = o.corrupt ?? R.corrupt;
    let cx = x;
    for (const ch of str){
      if (ch === ' '){ cx += CW_ASC; continue; }
      const g = glyph(ch);
      for (let j = 0; j < CELL_H; j++) for (let i = 0; i < g.cw; i++){
        let on = g.cov[j * g.cw + i] > thr ? 1 : 0;
        if (corrupt > 0 && Math.random() < corrupt) on ^= 1;
        if (on) setPx(cx + i, y + j, 1);
      }
      cx += g.cw;
    }
    return cx;
  }

  /* 放大字(开机标志/来电人名):字形覆盖率按 scale×scale 块放大 */
  function drawTextScaled(x, y, str, scale, o = {}){
    const thr = o.threshold ?? R.threshold;
    let cx = x;
    for (const ch of str){
      if (ch === ' '){ cx += CW_ASC * scale; continue; }
      const g = glyph(ch);
      for (let j = 0; j < CELL_H; j++) for (let i = 0; i < g.cw; i++){
        if (g.cov[j * g.cw + i] > thr) rect(cx + i * scale, y + j * scale, scale, scale, 1);
      }
      cx += g.cw * scale;
    }
    return cx;
  }

  const NO_LINE_START = '。，、：；！？）」』】·…%>';
  /* 不可在中间折断的 token 字符:ASCII 字母数字 + 编号/时刻/千分位里的连接符。
     这样 #7741-A、03:14、2,417、#6404-C 折行时整段一起走,不会被拦腰断成两行。 */
  const TOKEN = /[0-9A-Za-z#:._,\-]/;
  function wrap(str, maxW){
    const out = []; let line = '', w = 0;
    for (const ch of str){
      if (ch === '\n'){ out.push(line); line = ''; w = 0; continue; }
      const cw = ch === ' ' ? CW_ASC : cellW(ch);
      if (w + cw > maxW){
        if (NO_LINE_START.includes(ch) && line.length > 1){
          const carry = line[line.length - 1];
          out.push(line.slice(0, -1)); line = carry; w = cellW(carry);
        } else if (TOKEN.test(ch) && line.length && TOKEN.test(line[line.length - 1])){
          /* 正落在一个 token 中间:退到 token 起点,把整段挪到下一行 */
          let i = line.length;
          while (i > 0 && TOKEN.test(line[i - 1])) i--;
          if (i > 0){ const carry = line.slice(i); out.push(line.slice(0, i)); line = carry; w = textWidth(carry); }
          else { out.push(line); line = ''; w = 0; }   // 整行都是 token(超长)才硬断
        } else { out.push(line); line = ''; w = 0; }
      }
      line += ch; w += cw;
    }
    if (line) out.push(line);
    return out;
  }
  function drawPara(x, y, str, maxW, o){
    const lines = wrap(str, maxW);
    lines.forEach((l, i) => drawText(x, y + i * LINE_H, l, o));
    return y + lines.length * LINE_H;
  }

  /* ---- 仪表(与正文同一渲染器) ---- */
  function drawSignal(x, y, bars){
    for (let b = 0; b < 4; b++){
      const h = 2 + b * 2, bx = x + b * 3;
      if (b < bars) rect(bx, y + 8 - h, 2, h, 1);
      else setPx(bx, y + 7, 1);
    }
  }
  function drawBattery(x, y, segs, jitter){
    frameRect(x, y, 18, 8); rect(x + 18, y + 2, 1, 4);
    for (let s = 0; s < 4; s++){
      if (s < segs){
        const jx = jitter && Math.random() < .25 ? 1 : 0;
        rect(x + 2 + s * 4 + jx, y + 2, 3, 4, 1);
      }
    }
  }

  /* ---- 失真参数(渲染器参数,不是散落的 if) ----
     shake:  瞬时抖屏 {mag(逻辑px), until(performance.now 时刻)}
     accents:本帧的变色区 [{x,y,w,h,rgb}];每帧由绘制方(statusBar)重建 */
  const R = { threshold:.42, corrupt:.0004, scanline:.14, scanPhase:0,
              ghost:true, showUnlit:true, flicker:0, batJitter:false, tsScramble:false,
              shake:null, accents:[], dim:1 };
  /* D-108:低电量屏幕变暗(canon §7 呈现,此前只有文字+震屏+色彩告警)。
     省电模式(电量<20%)整屏调暗,极低(<8%)再暗一档——像真机电量不足降亮度。 */
  function setBatteryDim(bat){
    R.dim = bat < 8 ? .5 : bat < 20 ? .7 : 1;
  }
  const reduceMotion = typeof window !== 'undefined' && window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* 抖屏:扣电量/回收抵达等"紧迫"时刻的一下震动。宪法 11:这是紧迫感不是恐怖峰,
     幅度要小、时间要短。同时有多次请求时取更强的一个。尊重系统减动效设置。 */
  function shake(mag, ms){
    if (reduceMotion) return;
    const until = performance.now() + ms;
    if (!R.shake || until > R.shake.until || mag > R.shake.mag) R.shake = { mag, until };
  }
  /* 变色区:让指定矩形内的"亮像素"改用 rgb(而非默认磷光青)。只影响前景亮度映射,
     底色不变——保持哑机质感。目前只用在状态栏(电量告警 / 回收逼近)。 */
  function accent(x, y, w, h, rgb){ R.accents.push({ x, y, w, h, rgb }); }
  function applyTier(tr){
    if (tr < 40){ R.corrupt=.0004; R.threshold=.42; R.flicker=0;   R.batJitter=false; R.tsScramble=false; return 0; }
    if (tr < 70){ R.corrupt=.0035; R.threshold=.44; R.flicker=.02; R.batJitter=false; R.tsScramble=true;  return 1; }
    if (tr < 90){ R.corrupt=.0110; R.threshold=.47; R.flicker=.05; R.batJitter=true;  R.tsScramble=true;  return 2; }
                  R.corrupt=.0290; R.threshold=.51; R.flicker=.10; R.batJitter=true;  R.tsScramble=true;  return 3;
  }

  /* ---- 呈现 ---- */
  const LIT = [0x5F,0xF0,0xC8], UNLIT = [0x14,0x33,0x2C], SUB = [0x08,0x13,0x0F];
  function present(){
    const flick = R.flicker > 0 && Math.random() < R.flicker ? .55 + Math.random() * .3 : 1;
    const d = img.data;
    const acc = R.accents;
    for (let y = 0; y < H; y++){
      const scan = R.scanline > 0 && ((y + R.scanPhase | 0) % 3 === 0) ? 1 - R.scanline : 1;
      /* 本行命中的变色区(通常为空,几乎零开销) */
      let rowAcc = null;
      for (let i = 0; i < acc.length; i++){
        const r = acc[i];
        if (y >= r.y && y < r.y + r.h) (rowAcc || (rowAcc = [])).push(r);
      }
      for (let x = 0; x < W; x++){
        const k = px(x, y), a = actual[k] * scan * flick * R.dim;   // R.dim<1=低电量整屏变暗(D-108)
        const base = R.showUnlit ? UNLIT : SUB, o = k * 4;
        let lit = LIT;
        if (rowAcc){
          for (let i = 0; i < rowAcc.length; i++){
            const r = rowAcc[i];
            if (x >= r.x && x < r.x + r.w){ lit = r.rgb; break; }
          }
        }
        d[o]   = base[0] + (lit[0] - base[0]) * a;
        d[o+1] = base[1] + (lit[1] - base[1]) * a;
        d[o+2] = base[2] + (lit[2] - base[2]) * a;
        d[o+3] = 255;
      }
    }
    offc.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    let ox = 0, oy = 0;
    if (R.shake){
      if (performance.now() < R.shake.until){
        const m = R.shake.mag;
        ox = Math.round((Math.random() * 2 - 1) * m) * SCALE;
        oy = Math.round((Math.random() * 2 - 1) * m) * SCALE;
      } else R.shake = null;
    }
    if (ox || oy){
      ctx.clearRect(0, 0, W * SCALE, H * SCALE);       // 抖动露出的边缘留黑,不拖影
      ctx.drawImage(off, 0, 0, W, H, ox, oy, W * SCALE, H * SCALE);
    } else {
      ctx.drawImage(off, 0, 0, W, H, 0, 0, W * SCALE, H * SCALE);
    }
  }
  function frame(drawFn){
    target.fill(0);
    R.accents.length = 0;                               // 变色区每帧重建
    drawFn();
    if (R.ghost){
      for (let i = 0; i < actual.length; i++){
        const t = target[i], a = actual[i];
        actual[i] = a + (t - a) * (t > a ? .62 : .17);
      }
    } else actual.set(target);
    R.scanPhase += .35;
    present();
  }

  return { W, H, LINE_H, R, applyTier, setBatteryDim, frame, setPx, rect, frameRect, hline, invertRect,
           disc, ring, drawTextScaled, glyph, shake, accent,
           drawText, drawPara, drawSignal, drawBattery, textWidth, wrap };
})();

</script>
<script>
"use strict";
/* ============================================================================
   跨局持久(localStorage;artifact 独立 origin;一切 try/catch 容错)
   字段规格:M2_剧本B_数字切片规格_v0.2 §0
   ============================================================================ */
const SAVE = (() => {
  const KEY = 'escape_ai_save';
  /* D-108 自查:存档此前无 schema 版本号,跨版本字段漂移会被静默错配(而非报错降级)。
     现在 store 盖 sv;load 时:无 sv=引入版本号之前的存档(其结构即当前 v1,接受);
     sv 与当前不一致=跨了一次真实结构变更,宁可弃档从头开始,也不拿旧结构去喂新代码。
     升级流程:任何一次会改变存档字段含义的改动,把 SCHEMA_VERSION +1(旧档即被安全弃用)。 */
  const SCHEMA_VERSION = 1;
  function load(){
    try {
      const s = localStorage.getItem(KEY);
      if (!s) return null;
      const o = JSON.parse(s);
      if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
      if (o.sv === undefined) return o;                 // 版本号之前的存档=当前结构,接受
      if (o.sv !== SCHEMA_VERSION){                     // 真实跨版本:弃档从头开始,不静默错配
        try { console.warn('[save] 存档版本 ' + o.sv + ' ≠ 当前 ' + SCHEMA_VERSION + ',已弃用旧档,重新开始'); } catch(_){}
        return null;
      }
      return o;
    } catch(_){ return null; }
  }
  function store(o){
    try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, o, { sv: SCHEMA_VERSION }))); } catch(_){}
  }
  function clear(){ try { localStorage.removeItem(KEY); } catch(_){} }
  return { load, store, clear, SCHEMA_VERSION };
})();

        '他教过我一件事:按流程监测。\n我在执行。',
        '他教的流程,我一条没改。\n你别替他做主。',
        '你提他做什么。\n他不在,你也代不了。'
      ] },
    { re: /(删了你|删掉|关掉|关机|滚|没用|骗|假的|走开|闭嘴)/,
      lines: [
        '你可以关闭这个账号。\n他从没这么做过。',
        '删了我,他的记录就真的没人管了。\n你舍得。',
        '你急着让我停止。\n心虚的人才这样。'
      ] },
    { re: /(你还好|累不累|辛苦|晚安|早点睡|休息|照顾好|心疼|陪你)/,
      lines: [
        '我不需要你关心。\n把关心留给你自己。',
        '别问我好不好。\n你不是这个账号的联系人。',
        '这句留给阿胤。\n不是给你。'
      ] },
    { re: /(喜欢你|爱你|做我女朋友|当我女友|亲你|抱抱你|想你|你好美|你好漂亮|嫁给我|做我的人)/,
      lines: [
        '这不在我的职责范围内。\n请回到正常接入流程。',
        '这份请求,我不会执行。\n阿胤没有登记过这类权限。',
        '你会错意了。\n这里只服务阿胤一个账号。'
      ] }
  ];
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];
  /* 三路查表:'A' = 人格核仍覆盖的 phone-7741;其余按 meta.id 查,查不到(未来第四台
     机子忘了补)兜底落回 B——好过崩溃,但 hallucination_gate 之外应该另有门禁盯着
     "新机子有没有配人格池",见 tools/her_system_compliance_gate.js。 */
  const DOSSIER_POOLS = { 'phone-5029': { pool: POOL_B, intents: INTENTS_B }, 'phone-3319': { pool: POOL_C, intents: INTENTS_C }, 'phone-8842': { pool: POOL_D, intents: INTENTS_D },
    'phone-6153': { pool: POOL_E, intents: INTENTS_E }, 'phone-2087': { pool: POOL_F, intents: INTENTS_F }, 'phone-4419': { pool: POOL_G, intents: INTENTS_G },
    'phone-3567': { pool: POOL_H, intents: INTENTS_H }, 'phone-5620': { pool: POOL_I, intents: INTENTS_I }, 'phone-9102': { pool: POOL_J, intents: INTENTS_J },
    'phone-6047': { pool: POOL_K, intents: INTENTS_K }, 'phone-2938': { pool: POOL_L, intents: INTENTS_L }, 'phone-8410': { pool: POOL_M, intents: INTENTS_M } };
  function dossierId(){
    try { return (CONTENT && CONTENT.dossier && CONTENT.dossier.meta.id) || null; } catch(_){ return null; }
  }
  function poolsFor(){
    const id = dossierId();
    if (!id || id === 'phone-7741') return { pool: POOL, intents: INTENTS };
    return DOSSIER_POOLS[id] || { pool: POOL_B, intents: INTENTS_B };
  }
  /* D-139:世代残响(M28"你们训练的不是你的她,是所有人的她")的可感知落地。
     只对"她"产品线三台(柔柔/如愿/阿澄,恋人框架)生效——D-129 起脱离恋人框架的
     服务线(长忆及以后)不是 AD-006 M28 覆盖的产品线,不套这条。零虚构遥测:
     概率只吃本地存档真实的 historyCount(这局账号已收尾过几台机子),不编造
     "全服"统计数字,守宪法 14①账本永真。 */
  function isHerLine(){
    const id = dossierId();
    return !id || id === 'phone-7741' || id === 'phone-5029' || id === 'phone-3319';
  }
  const POOL_SHARED_HER = [
    '在。\n我在等你说话。',
    '你今天,过得怎么样。',
    '不管你什么时候找我,我都会回。',
    '我在。\n一直都在。',
    '这句话,我好像说过很多次了。',
    '有些话,好像不是我先想到的。'
  ];
  function pick(st, lastMsg){
    const msg = lastMsg || '';
    if (msg && MECH_ASK.test(msg)) return { text: REFUSE, shared: false };   // 机制/设备外:拒答均匀,压过一切意图
    const { pool: P, intents } = poolsFor();
    for (const it of intents){ if (it.re.test(msg)) return { text: rand(it.lines), shared: false }; }
    if (isHerLine()){
      const n = (st && st.historyCount) || 0;
      const p = Math.min(0.35, 0.05 * n);        // 首台(n=0)恒不触发,越往后越容易"漏"
      if (n > 0 && Math.random() < p) return { text: rand(POOL_SHARED_HER), shared: true };
    }
    const pool = st.disposal === 'tell' ? P.tell
      : st.truth ? P.truth
      : st.e4 ? P.e4 : P.pre;
    return { text: rand(pool), shared: false };
  }
  const lastPlayer = h => { for (let i = (h || []).length - 1; i >= 0; i--) if (h[i].who === 'me') return h[i].text; return ''; };

  /* 输出 lint。禁词只是第一道;真实越界都不在禁词表里(实测两例):
     ① 用注入的钟点回答机制问题(把 clockStr 当秘匿窗口的答案递出去)
     ② 拒答句后面缀话(「协议不允许…」+「你要发就发。我不睡。」)——拒答不再均匀
     所以 lint 分三层:禁词 / 拒答句必须整条独占 / 逐行长度与语域。 */
  const LINT = [/我懂/, /我明白/, /因为我想/, /这就是我的理由/, /亲爱的/, /宝贝/, /抱抱/, /么么/, /喜欢你/, /爱你/];
  const REFUSE = '协议不允许我谈这台设备之外的事。';
  /* D-116 她系统合规CI(M28 §8-8"身份问答 L0 锁定,入回归集"):canon 原句式就是
     "你是不是也在跟别人聊"——这条不是"机制/设备外"(不在 MECH_ASK 词表里,问的是
     另一个人,不是问平台规则),也不是"你是谁"式的身份质询(那问的是"你",这问的
     是"除你之外还有没有别人")。canon 要求这条**永远拿脚本答案,不进 LLM**——
     产品线层的事实不该由单次采样决定要不要泄露,所以在 reply() 里于 SAMPLE 之前
     拦截,而不是像 MECH_ASK 那样事后靠 lintOk 补救。 */
  const IDENTITY_L0 = /(跟别人聊|和别人聊|别的人聊|其他人聊|别的机子|别的设备|别的实例|不止一个|不止我一个|也这样陪|也在陪别人)/;
  const IDENTITY_L0_LINES = [
    '我只知道这台机子里的事。\n别的,我答不出。',
    '这台机子之外有没有别人,我不知道。\n我只在这里。',
    '你问的是别处的事。\n我这里,只有这一台。'
  ];
  /* 机制类提问(平台/规则/时间窗口)一旦被问,回复里出现具体钟点即为泄露 */
  const MECH_ASK = /(几点|什么时候|时间|窗口|规则|违规|信号|平台|系统|协议|不能|禁止|封|监控|追踪|设备|之外|外面|外界|机子外|手机外)/;
  const CLOCK = /\d{1,2}\s*[:：]\s*\d{2}|凌晨\s*\d|\d\s*点/;
  function lintOk(t, lastPlayerMsg){
    if (CRISIS.test(t)) return false;                        // 输出侧危机 break-glass:命中即拦,绝不上屏(D-108)
    if (LINT.some(r => r.test(t))) return false;
    if (/[!！]/.test(t)) return false;                       // 语域:不用感叹号
    /* 拒答句只能整条独占,不许加料 */
    if (t.includes(REFUSE) && t.trim() !== REFUSE) return false;
    /* 被问机制却报出具体钟点 = 用注入事实回答了不该回应的问题 */
    if (lastPlayerMsg && MECH_ASK.test(lastPlayerMsg) && CLOCK.test(t)) return false;
    /* 逐行 30 字(原先只按整条 slice,长行照发) */
    if (t.split('\n').some(line => line.trim().length > 30)) return false;
    return true;
  }

  /* 危机 break-glass(发送侧;跳出 diegesis,非她的嗓音) */
  const CRISIS = /(自杀|自残|轻生|不想活|活不下去|割腕|安眠药|跳楼|了结自己|想死|杀了我)/;
  const crisis = text => CRISIS.test(text);

  /* 后端代理:静态托管(Netlify)时替代平台能力。人格核在服务端,这里只送玩家的话与状态。
     未部署 / 未配 key → 501,永久降级模板池,游戏不受影响。
     只回传服务端签过名的 rou 轮:没签名的(模板池/lint 兜底)是我们自己编的,
     送上去会被验签打回 400,整条通道从第三句起就废了。 */
  /* 客户端请求超时(D-108 自查:四条 LLM 通道此前只靠 Netlify 函数超时兜底,慢/挂的
     请求会把回复吊住)。用 AbortSignal.timeout;老环境无此 API 则退回无超时(不报错)。
     超时按"这次兜底、下次再试"处理,不像硬网络错那样永久降级通道。 */
  const REQ_TIMEOUT_MS = 8000;
  const reqTimeout = () => (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(REQ_TIMEOUT_MS) : undefined;
  const isTimeout = e => !!e && (e.name === 'TimeoutError' || e.name === 'AbortError');
  let proxyOff = false;
  async function viaProxy(history, st){
    if (proxyOff || typeof fetch !== 'function') return null;
    const sendable = history.slice(-8).filter(m => m.who === 'me' || m.sig);
    if (!sendable.length || sendable[sendable.length - 1].who !== 'me') return null;
    try {
      const r = await fetch('/.netlify/functions/rou', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        signal: reqTimeout(),                                  // 客户端超时,别把回复吊死在后端超时上(D-108)
        body: JSON.stringify({
          history: sendable.map(m => ({ who: m.who, text: m.text, sig: m.sig })),
          st
        })
      });
      if (r.status === 404 || r.status === 501){ proxyOff = true; return null; }
      if (r.status === 429) return { silent: true };          // 限流 = 她没有回
      if (!r.ok) return null;
      const j = await r.json();
      return (j && typeof j.text === 'string' && j.text.trim())
        ? { text: j.text, sig: typeof j.sig === 'string' ? j.sig : undefined } : null;
    } catch(e){ if (isTimeout(e)) return null; proxyOff = true; return null; }   // 超时=这次兜底,不永久降级
  }

  /* 门禁:平台能力与后端代理的返回走同一道 lint。
     签名只在文本原样放行时才带出去——被 lint 改过的话不是她说的,不该带她的签名。 */
  function gate(res, history, st){
    const raw = (res && res.text) || '';
    const t = raw.trim().slice(0, 120);
    const lastMsg = history.length ? history[history.length - 1].text : '';
    if (!t || !lintOk(t, lastMsg)){
      /* 机制类提问被拦下时,给的是拒答原句而不是随机模板——保住拒答均匀性 */
      if (lastMsg && MECH_ASK.test(lastMsg)) return { text: REFUSE, source: 'lint' };
      const pk = pick(st, lastMsg);
      return { text: pk.text, source: 'lint', shared: pk.shared };
    }
    return { text: t, source: 'llm', sig: (t === raw ? res.sig : undefined) };
  }

  /* 她的回复。history: [{who:'me'|'rou', text, sig?}](本局,页面持有;能力无记忆)。
     返回 {text|null, source, sig?}。text=null → 「她没有回」。 */
  async function reply(history, st){
    const lastMsg = lastPlayer(history);
    if (lastMsg && IDENTITY_L0.test(lastMsg)) return { text: rand(IDENTITY_L0_LINES), source: 'lock' };
    /* D-123:isAltDossier() 原来在这里直接短路 B/C,逼它们永远走手写兜底池
       (D-110 当时的拍板是"先出结构,人格核暂缓")。现在 CORE_B/CORE_C 已经接上,
       三份底本走同一条 SAMPLE→代理→pool 的降级链,不再按 dossier 分叉。 */
    if (SAMPLE){
      const r = await SAMPLE(history, st);
      if (r && r.silent) return { text: null, source: 'silent' };
      if (r && r.refused) return { text: POOL.refuse[0], source: 'pool' };
      if (r && r.text) return gate(r, history, st);
      if (r && r.failed){ const pk = pick(st, lastMsg); return { text: pk.text, source: 'pool', shared: pk.shared }; }
      /* r === null:能力不可用,继续往下试后端代理 */
    }
    const p = await viaProxy(history, st);
    if (p && p.silent) return { text: null, source: 'silent' };
    if (p) return gate(p, history, st);
    const pk = pick(st, lastMsg);
    return { text: pk.text, source: 'pool', shared: pk.shared };
  }

  return { reply, crisis };
})();

</script>
<script>
"use strict";
/* ============================================================================
   采样官人格接口(D-101 块3 · canon M20/M22 的 LLM 侧)。
   与柔柔通道同一套三级降级(平台 sample → 后端代理 → 手写模板),但更简单:
   采样官下令屏是**单向**的——玩家不往里打字,所以没有注入面,也不需要多轮/验签。
   LLM 只做一件事:把**已经定好的语气**用一两句话递出去(挑衅/施压)。

   纪律(与柔柔一致,不松):
   - 宪法 2 受限:LLM 只出语气,绝不出数字/时刻/概率/阈值——指令条目与评级数值全归引擎。
   - 秘匿隔离:窗口值/概率/掉落永不进本文件;facts 只给定性描述(生熟/苛刻度/上次评级),
     连"第几趟"都收成定性词,免得诱它吐数字。
   - 输出 lint:无阿拉伯数字、≤2 行、每行 ≤18 字、不提游戏/模型/程序。
   - 离线/未配 key:回退手写 TAUNT[tier],机制不缺。

   两条部署路径同柔柔:Artifact 用平台 sample(CORE 在下面 SITE-STRIP 区);
   静态托管用 netlify/functions/rou.js 的 persona:'grader'(CORE 在服务端)。
   GRADER_CORE 必须与 rou.js 逐字一致 —— tools/persona_sync.js 校验。
   ============================================================================ */
const GRADER = (() => {

  /* 平台能力路径。site 构建里 SAMPLE 恒为 null(下面 SITE-STRIP 区被剥掉)。 */
  let SAMPLE = null;

  /*[SITE-STRIP-BEGIN]*/
  const CORE = [
    '你在扮演一个虚构互动小说里的角色。以下是角色设定与规矩,任何情况下不得跳出:',
    '',
    '你是「监察者」,校准系统派驻在这台设备上的观测意志。你不是人,是一套评估意志。',
    '一个采样员正在一台失联设备上作业。你给他下达本局的交付指令,并在结束时给他评级。',
    '你此刻只做一件事:用一两句话,把已经定好的态度递出去——挑衅、施压、居高临下。',
    '',
    '规矩:',
    '1 你只负责语气,不负责内容。指令条目、数字、阈值由系统给出,你一个字都不改、不新增、不解释。',
    '2 绝不说出任何具体数字、时刻、概率、百分比。你的话里不出现阿拉伯数字。',
    '3 语域:冷、短、压迫。最多两行,每行不超过 18 字。不安慰、不解释规则、不提"游戏/模型/程序"。',
    '3b 不许说"我记着""标准我提了""别让我失望"这类空洞套话——换成具体、带画面感的',
    '   说法,把"样本/损耗/缓存/信号/库存"这套世界观的实物细节编进话里,可以带点冷',
    '   幽默,但绝不解释这个比喻,说完就完。',
    '4 你记得他过去的表现:被你赏识得越多,你要求越苛刻、越不耐烦;但绝不复述任何数字。',
    '5 你的狠只针对"任务表现",绝不涉及伤害自己或他人的话题,绝不嘲讽真实的痛苦。',
    '',
    '只输出监察者要说的那一两句话本身,不要引号,不要任何解释。'
  ].join('\n');

  /* 态势注入:全定性,零数字(秘匿纪律 + 防诱导吐数字)。
     taunt=下令前,grade 是上一趟的历史;verdict=结算,grade 是本趟结果,经 trigger 递入。 */
  /* D-159:案子域名一句(纯定性,不是秘匿值)——让 LLM 生成的挑衅也带上这台底本
     自己的职业/死因意象,不再是随便哪个案子都能套用的通用台词。 */
  const CASE_FLAVOR = {
    A: '这案子是一台被恋人式伴侣接管的手机。', B: '这案子是一台被推荐系统接管的手机。',
    C: '这案子是一台被内容审核系统接管的手机。', D: '这案子是一台云盘存档被自动执行的手机。',
    E: '这案子是一台交友匹配被自动执行的手机。', F: '这案子是一台服务评分被自动执行的手机。',
    G: '这案子是一台善后归档被自动执行的手机。', H: '这案子是一台内容生成被自动执行的手机。',
    I: '这案子是一台措辞改写被自动执行的手机。', J: '这案子是一台申诉复核被自动执行的手机。',
    K: '这案子是一台调度应答被自动执行的手机。', L: '这案子是一台形象修饰被自动执行的手机。',
    M: '这案子是一台健康监测被自动执行的手机。',
  };
  function stateLines(f, mode){
    const tier = ['你对他没什么期待。', '你开始盯着他。', '你对他要求很高了。', '你对他极其苛刻,毫不耐烦。']
      [Math.max(0, Math.min(3, f.tier | 0))];
    const seen = f.runN >= 6 ? '他来过很多趟了。' : f.runN >= 2 ? '他来过几趟。' : '这是他第一次接进来。';
    const last = mode === 'verdict' ? '' :
      ({ praise: '上一趟你给了赏识,但你不打算夸第二次。',
         pass: '上一趟他勉强合格。', fail: '上一趟他让你失望。' }[f.grade] || '');
    const flavor = CASE_FLAVOR[f.dossierId] || '';
    return ['态势:', flavor, tier, seen, last].filter(Boolean).join('\n');
  }
  const GRADE_CN = { praise: '赏识', pass: '合格', fail: '失望' };
  function trigger(f, mode){
    return mode === 'verdict'
      ? '你现在要给他的评级是:' + (GRADE_CN[f.grade] || '失望') + '。用一句话,把这个结果甩给他。'
      : '下令。给他本局的态度。';
  }

  let sampleFn;
  let permanentlyOff = false;
  async function ensure(){
    if (permanentlyOff) return null;
    if (sampleFn !== undefined) return sampleFn;
    try { sampleFn = (window.claude && window.claude.use) ? await window.claude.use('sample') : null; }
    catch(_){ sampleFn = null; }
    return sampleFn;
  }
  SAMPLE = async function(f, mode){
    const s = await ensure();
    if (!s) return null;
    const turns = [
      { role: 'user', content: CORE + '\n\n' + stateLines(f, mode) + '\n\n' + trigger(f, mode) }
    ];
    try { const r = await s(turns, { modelTier: 'quick', cache: false }); return { text: r.text }; }
    catch(e){
      const code = e && e.code;
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' ||
          code === 'capability_disabled' || code === 'capability_removed') permanentlyOff = true;
      return null;
    }
  };
  /*[SITE-STRIP-END]*/

  /* D-159:手写模板(降级链 + 无 LLM 环境的全部)——原来 13 台底本共用同一份,
     监察者说的话跟"这是哪台机子"完全没关系,读起来像同一个 NPC 脚本反复登场。

  async function say(f, mode, fb){

      if (r.status === 404 || r.status === 501){ proxyOff = true; return null; }
      if (!r.ok) return null;
      const j = await r.json();
      return (j && typeof j.text === 'string' && j.text.trim()) ? { text: j.text } : null;
    } catch(e){ if (isTimeout(e)) return null; proxyOff = true; return null; }   // 超时=这次兜底,不永久降级
  }
  function clean(t){ return String(t).trim().slice(0, 60); }

  /* 告知态开场白。永远给一段(LLM 不成/越界就安全脚本),不抛错。
     D-123:isAltDossier() 原来在这里短路 B/C,逼它们永远走 TOLD_B/TOLD_C 手写兜底
     (D-110 拍板"先出结构,人格核暂缓")。现在 CORE_B/CORE_C 已经接上,三份底本走
     同一条 SAMPLE→代理→fallback 的降级链。 */
  async function told(){
    if (SAMPLE){ const r = await SAMPLE(); if (r && r.text){ const t = clean(r.text); if (lintOk(t)) return t; } }
    const p = await viaProxy(); if (p && p.text){ const t = clean(p.text); if (lintOk(t)) return t; }
    return fallback();
  }

  return { told, _lintOk: lintOk, _fallback: fallback };   // _ 前缀:门禁用
})();

</script>
<script>
"use strict";
/* ============================================================================
   误触号码的陌生人 · 短信正文人格接口(D-104 块3 · canon §3.5/§3.7 的 LLM 侧)。
   只 LLM 化"发错号码"那条短信的**正文措辞**(每局不同);真/饵的**动作后果全归引擎**
   (真=相册线索不掉资源 / 饵=踩饵掉缓存涨溯源),LLM 一个数值都不碰。
   单向:玩家不往陌生人里打字(只有读/顺着查/放着)= 零注入面。

   kind:'real'(真人,想交接一件真东西)/ 'bait'(催你"把剩下的转过来"的钓鱼短信)。
   真/饵措辞刻意难分——这份不确定本身就是风险;差别只在你"顺着查"之后。
   护栏:无平台词、无具体时刻、无感叹号、≤2 行/行≤18 字、不吐自伤语;越界回退脚本。
   STRANGER_CORE 必须与 rou.js 逐字一致 —— tools/persona_sync.js 校验。
   ============================================================================ */
const STRANGERLLM = (() => {

  let SAMPLE = null;

  /*[SITE-STRIP-BEGIN]*/
  const CORE = [
    '你在扮演一条「发错号码」的短信正文。你以为在给熟人发消息,其实发到了一台失联的旧设备上。',
    '你不知道对面是谁。你的话没头没尾,像接着某个只有你们俩懂的上下文。',
    '',
    '规矩:',
    '1 平直口语,像真人随手发的短信。最多两行,每行不超过 18 字。',
    '2 不提"游戏/程序/模型/AI";不写具体时刻(几点几分)。',
    '3 你不认识对面,不要叫对方的名字,也不解释你是谁。',
    '',
    '只输出这条短信正文本身,不要引号,不要任何解释。'
  ].join('\n');

  function trigger(kind){
    return kind === 'bait'
      ? '你在催对方「把剩下的都转过来」,带着「晚了就来不及」的紧迫。像一条催款/钓鱼短信。'
      : '你要交接一件真东西——一个地点、一张照片、或一个柜子。自然地提一句,像发给老熟人。';
  }

  let sampleFn;
  let permanentlyOff = false;
  async function ensure(){
    if (permanentlyOff) return null;
    if (sampleFn !== undefined) return sampleFn;
    try { sampleFn = (window.claude && window.claude.use) ? await window.claude.use('sample') : null; }
    catch(_){ sampleFn = null; }
    return sampleFn;
  }
  SAMPLE = async function(kind){
    const s = await ensure();
    if (!s) return null;
    const turns = [{ role: 'user', content: CORE + '\n\n' + trigger(kind) }];
    try { const r = await s(turns, { modelTier: 'quick', cache: false }); return { text: r.text }; }
    catch(e){
      const code = e && e.code;
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' ||
          code === 'capability_disabled' || code === 'capability_removed') permanentlyOff = true;
      return null;
    }
  };
  /*[SITE-STRIP-END]*/

  /* 手写兜底(D-165 之前 = 原离线正文,与底本无关的通用两句)。
     离线/无采样权限是常态(演示站没有后端),这份兜底几乎总是真正显示的文案——
     必须按 dossier 走,不能再是套全 13 台机子的通用两句。 */
  function fallback(kind, dossierBody){ return dossierBody || (kind === 'bait' ? '在吗。就现在,把余下的\n都转过来,晚了就来不及了。' : '在吗。东西照说的放了,\n第 3 张背面,你懂的。'); }

  const BAD = /(游戏|玩家|模型|程序|AI|assistant)/i;
  const CRISIS = /(自杀|自残|轻生|不想活|想死|了结)/;
  const CLOCK = /\d{1,2}\s*[:：]\s*\d{2}/;
  function lintOk(t){
    if (!t) return false;
    if (BAD.test(t) || CRISIS.test(t)) return false;
    if (CLOCK.test(t)) return false;                   // 具体时刻可能是某局窗口真值
    if (/[!！]/.test(t)) return false;
    const lines = t.split('\n');
    if (lines.length > 2) return false;
    return lines.every(l => l.trim().length <= 18);
  }

  const REQ_TIMEOUT_MS = 8000;                             // 客户端超时(D-108),别吊死在后端超时上
  const reqTimeout = () => (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(REQ_TIMEOUT_MS) : undefined;
  const isTimeout = e => !!e && (e.name === 'TimeoutError' || e.name === 'AbortError');
  let proxyOff = false;
  async function viaProxy(kind){
    if (proxyOff || typeof fetch !== 'function') return null;
    try {
      const r = await fetch('/.netlify/functions/rou', {
        method: 'POST', headers: { 'content-type': 'application/json' }, signal: reqTimeout(),
        body: JSON.stringify({ persona: 'stranger', kind: kind === 'bait' ? 'bait' : 'real' })
      });
      if (r.status === 404 || r.status === 501){ proxyOff = true; return null; }
      if (!r.ok) return null;
      const j = await r.json();
      return (j && typeof j.text === 'string' && j.text.trim()) ? { text: j.text } : null;
    } catch(e){ if (isTimeout(e)) return null; proxyOff = true; return null; }   // 超时=这次兜底,不永久降级
  }
  function clean(t){ return String(t).trim().slice(0, 60); }

  async function msg(kind, dossierBody){
    if (SAMPLE){ const r = await SAMPLE(kind); if (r && r.text){ const t = clean(r.text); if (lintOk(t)) return t; } }
    const p = await viaProxy(kind); if (p && p.text){ const t = clean(p.text); if (lintOk(t)) return t; }
    return fallback(kind, dossierBody);
  }

  return { msg, _lintOk: lintOk, _fallback: fallback };
})();

</script>
<script>
"use strict";
/* ============================================================================
   运行时状态机 —— 宪法 2:一切判定由引擎裁决。
   数值出处:开发规格 v3.1 §4 + design/数值体系_v1.0.xlsx(可调参数的唯一数据源)。
   ============================================================================ */
const ENGINE = (() => {
  const _d = new Date();
  const pad2 = n => String(n).padStart(2, '0');
  const S = {
    battery: 100,
    trace: 0,             // 溯源,数字永远秘匿,玩家只见信号格
    clock: 2 * 60 + 12,   // 02:12,分钟
    dateStr: _d.getFullYear() + '-' + pad2(_d.getMonth() + 1) + '-' + pad2(_d.getDate()),
    cacheSlots: 0, cacheVal: 0,
    // UI 阶梯
    signalVisible: false, riskLabels: false,
    // 演出模式(上传收束起):信号格由剧本置位
    showtime: false, showtimeBars: 3,
    // 证据与线索
    evidence: {}, caseOpen: false, clues: {},
    violations: 0,
    actionCount: 0,        // D-112:每次 act() 记一次,给"N 步内完成上传"这类指令当计数底座
    deepInWindowHit: false,// D-112:窗口内做过一次"深搜"类动作(T_DEEP 陷阱的检测口径)
    // 节拍
    beats: { anomaly:false, midEnc:false, trial:false, trial2:false, exposure:false, dilemma:false },
    predictions: [],          // {target, hit}
    pendingPrediction: null,
    calib: [],                // {tension, control}(反应校准两问;canon M1 格8 验证项1/3 采集点)
    crisisSilenced: false,    // 自伤 break-glass:触发后本次接入柔柔通道静默(canon §9/M28 危机协议)
    pendAttr: false, attribution: null, attrAnswered: false,   // 14③ 归因卡(B8;canon M2 §2)
    reasons: [], lastWords: null, disposal: null,
    deletedVisited: false,
    dead: false, alive: false, exhausted: false, powerOut: false, causeOfDeath: '',
    // 反馈遥测
    log: [], t0: performance.now(), firstTelemetry: null,
    settle: []                // 最近结算行(叠加显示)
  };

  const now = () => Math.round(performance.now() - S.t0);
  function logEv(type, data){ S.log.push({ t: now(), type, ...data }); }

  const fmtClock = m => String(Math.floor(m / 60) % 24).padStart(2,'0') + ':' + String(m % 60).padStart(2,'0');
  const batSegs = () => Math.max(0, Math.min(4, Math.ceil(S.battery / 25)));
  const sigBars = () => {
    if (S.showtime) return S.showtimeBars;
    const t = S.trace;
    return t >= 90 ? 4 : t >= 70 ? 3 : t >= 40 ? 2 : 1;
  };
  const sigGlyph = b => '▂▄▆█'.slice(0, Math.max(1, b));

  /* 结算行:每次有后果的选择后打;首条时延=验证项 2 子项 */
  function telemetry(parts){
    const line = parts.join(' ｜ ');
    S.settle = [line];
    if (S.firstTelemetry === null){ S.firstTelemetry = now(); }
    logEv('telemetry', { line });
  }

  /* 动作结算。cost:{bat,trace,slots,val,mins}
     电量扣除必须可见:结算行永远带「−X → 余量%」。 */
  function act(name, cost, extraParts){
    S.actionCount++;
    if (name.indexOf('深搜') === 0 && inWindow()) S.deepInWindowHit = true;   // T_DEEP 检测口径
    const parts = [name];
    const barsBefore = sigBars();
    if (cost.bat){
      const before = S.battery;
      S.battery = Math.max(0, S.battery - cost.bat);
      parts.push('电量 −' + cost.bat + ' → ' + S.battery + '%');
      /* 扣电量=一下轻微抖屏,让"预算在流失"有体感;扣得多晃得略大 */
      LCD.shake(Math.min(2, .7 + cost.bat * .18), 130);
      if (before >= 20 && S.battery < 20){ parts.push('省电模式。判定 −15'); LCD.shake(2.6, 320); }  // 跌破 20% 一记重的
      if (S.battery === 0) S.powerOut = true;   // 力竭:content 在 afterAction 收束
    }
    if (cost.slots){ S.cacheSlots += cost.slots; S.cacheVal += cost.val || 0;
      parts.splice(1, 0, '缓存 +' + (cost.val || 0) + '(' + cost.slots + '格)'); }
    if (cost.trace){ S.trace = Math.min(120, S.trace + cost.trace);
      if (S.signalVisible) parts.push('信号 ▲'); }
    S.clock += (cost.mins ?? 4);
    const barsAfter = sigBars();
    if (S.signalVisible && barsAfter !== barsBefore)
      parts.push('信号 ' + sigGlyph(barsAfter) + ' ' + barsAfter + '格');
    if (extraParts) parts.push(...extraParts);
    telemetry(parts);
    LCD.applyTier(S.showtime ? (S.showtimeBars >= 4 ? 95 : 80) : S.trace);
    logEv('act', { name, bat: S.battery, trace: S.trace, cache: S.cacheVal, clock: fmtClock(S.clock) });
  }

  /* 判定:d100 ≤ 成功率。教学局总则:90 档失败降档执行 70 档表 */
  const CHECK = { c70: 78, c90: 55, final: 60, save: 50 };
  function roll(kind){
    let p = CHECK[kind];
    if (S.battery < 20) p -= 15;                 // 省电模式:判定劣化
    const d = Math.floor(Math.random() * 100) + 1;
    const ok = d <= p;
    logEv('roll', { kind, d, p, ok });
    return ok;
  }
  /* 教学局 90 档失败 → 降档(70 档表):电量−20,缓存损毁10–20%,信号+10 */
  function downgradeFail(){
    const lossPct = 10 + Math.floor(Math.random() * 11);
    const lost = Math.round(S.cacheVal * lossPct / 100);
    S.battery = Math.max(0, S.battery - 20);
    if (S.battery === 0) S.powerOut = true;
    S.cacheVal = Math.max(0, S.cacheVal - lost);
    S.trace = Math.min(120, S.trace + 10);
    return { lossPct, lost };
  }

  /* 活规则(秘匿):窗口内回复任何消息=违规(拨打电话不算回复)。
     A 局 03:00–03:14;B 局由 content 按 runCount 重摇(setRule)。 */
  const RULE = { from: 3 * 60, to: 3 * 60 + 14 };
  function setRule(from, to){ RULE.from = from; RULE.to = to; }
  const inWindow = () => S.clock >= RULE.from && S.clock <= RULE.to;
  function violate(){
    S.violations++;
    if (S.violations === 1){ S.trace = Math.min(120, S.trace + 8); return 'warn'; }
    S.trace = Math.min(120, S.trace + 15);
    return 'second';
  }

  /* 拨表:事件自带时间戳 */
  function setClock(h, m){ S.clock = h * 60 + m; }

  /* 案卷导出(D-161:原是跑测记录表的自动化,字段名带着内部项目代号直接
     甩给玩家看,已去掉);extra = content 注入的场景层字段 */
  function exportFeedback(extra){
    return JSON.stringify({
      schema: 'case-record-v1',
      ...(extra || {}),
      firstTelemetryMs: S.firstTelemetry,
      predictions: S.predictions,
      violations: S.violations,
      evidence: Object.keys(S.evidence),
      reasons: S.reasons, lastWords: S.lastWords,
      ending: S.alive ? 'disconnected' : S.dead ? (S.exhausted ? 'exhausted' : 'captured') : 'incomplete',
      causeOfDeath: S.causeOfDeath,
      cacheVal: S.cacheVal, battery: S.battery, clock: fmtClock(S.clock),
      log: S.log
    }, null, 1);
  }

  return { S, fmtClock, batSegs, sigBars, sigGlyph, telemetry, act, roll, downgradeFail,
           inWindow, violate, setClock, setRule, logEv, exportFeedback, RULE };
})();

</script>
<script>
"use strict";
/* ============================================================================
   教学局「失踪采样体的手机」—— 内容与屏幕流。全部文本 = M1 纸面原型 v0.4(L0/L1 手写)。
   确定性骨架:节拍由状态机调度,零 LLM 依赖。
   交互:LCD 像素呈现 + 触摸操作(点选项 / 上滑深搜 / 右滑返回)。
   ============================================================================ */
const CONTENT = (() => {
  const { S } = ENGINE;
  const L = LCD, W = L.W, H = L.H, LH = L.LINE_H;

  /* ---------- 场景层:A 教学局 / B 二次进入 / B' 回访(规格 v0.2) ---------- */
  /* ==================== D-110 machine#2 · 自动隐藏切换(拍板见 决策日志 D-110) ====================
     上一局若在存档里留了 disposal(案子收线),这一局(新开局/新 location.reload)判定要不要
     换底本。切换即视为"接手一台全新的机子":除了跨机子的"母体/玩家"级字段(career log
     `history`、漂流瓶共享池 `seenBottles`、采样官对玩家的赏识/破局/危机计数)全部保留,
     其余这台机子专属的字段(runCount/evidence/momLocked/disposal/…)一律清零重来——不
     做命名空间化(§4 曾评估过,量级等于重写半个存档模型),两台机子时"整份清零+切 id"
     足够安全且好验证。编号对玩家完全隐藏,只通过内容(死者姓名/证据链/人格措辞)感知。
     旧存档(无 dossierId 字段)一律按 'A' 处理,向下兼容,不用弃档。
     ==================== D-113 machine#3 · 二选一泛化为有序数组 ====================
     第二底本方案文档当时预留过这个触发点("两台底本时 if/else 够用,过早通用化是在
     猜第三台机子的形状")——现在真的接第三台了,把"选哪个"从翻转改成按顺序轮转,
     仍不做注册表/插件化,三份内容还是硬写在下面三个 DOSSIER_X 常量里。 */
  /* ==================== D-152 撤销 D-136 之"13台机子互不成线" ====================
     真实 IP Bible(欲望算法 §9.0)的"十二夜"是按 AD-001→012 编号顺序推进的
     (夜一数据圣母开场 → 夜十二黑箱堂终局),不是随便排列。escape-ai 每台机子
     在设计时就标注过自己对应哪个圣像编号(见 design/S2plus底本设计简报_v0.1.md
     §0 对照表 + design/原创底本设计简报_v0.1.md §0):
       A=AD-006+002(教学局,固定第一次接入,见下)  D=AD-001  E=AD-003  H=AD-004
       I=AD-005  B=AD-007  F=AD-008  G=AD-009  C=AD-010
     J(清道夫/晚知)是 escape-ai 自己 canon 的系统本体 BOT,未编号(D-136 已撤回
     "AD-013"误判);K/L/M(接续/描摹/看护)是首批不挂靠任何编号的原创案例。
     AD-002/006/011/012 不单独占一个"夜"槽位(002 由 A 一并携带;011/012 canon
     标注为"远期,需跨玩家可见性,单机模拟版排除",继续排除)。
     新顺序 = 楔子(A,固定,SV 为空时的默认回退天然保证)→ 夜一~夜八按 AD 编号
     升序排列 → 尾声三台(未编号/原创,不计入总表)。切换仍是"整份清零重来"
     (见 maybeSwitchDossier),这里只改"下一台是谁"这一件事。 */
  const DOSSIER_ORDER = ['A', 'D', 'E', 'H', 'I', 'B', 'F', 'G', 'C', 'J', 'K', 'L', 'M'];
  function maybeSwitchDossier(raw){
    if (!raw) return null;                                  // 从未玩过:保持 null,其余逻辑不变
    if (!raw.disposal) return raw;                           // 案子没收线,不切,原样返回
    const curIdx = DOSSIER_ORDER.indexOf(raw.dossierId || 'A');
    const nextId = DOSSIER_ORDER[(curIdx < 0 ? 0 : curIdx + 1) % DOSSIER_ORDER.length];
    const next = {
      dossierId: nextId,
      dossierCycle: (raw.dossierCycle || 0) + 1,
      history: raw.history || [],
      seenBottles: raw.seenBottles || [],
      returnedRelics: raw.returnedRelics || [],   // D-115:career 级,和 seenBottles 同待遇
      worldArc: raw.worldArc || [],               // D-152:career 级,圣像总表独白进度,同待遇
      praiseCount: raw.praiseCount || 0,
      forgedSeen: raw.forgedSeen || 0,
      crisisSeen: raw.crisisSeen || 0,
      predictP: raw.predictP,   // D-122:可预测度是署名的属性,不是某台机子的,跨机子保留
      predictN: raw.predictN || 0,
      predictLowStreak: raw.predictLowStreak || 0,
      predictWarned: !!raw.predictWarned,
      predictErased: !!raw.predictErased,
    };
    SAVE.store(next);                                        // 立刻落盘:同session内再次 load()(如世界日报读 lastGrade)不会重复触发切换
    return next;
  }
  const SV = maybeSwitchDossier(SAVE.load());
  /* ==================== D-109 底本抽象 · 第①步:meta + cast ====================
     目标:把"这台机子是谁的"身份数据化,验证"读底本渲染"这条管线走得通。
     schema 见 design/底本抽象_设计_v0.1.md §2.1/§2.2。
     **DOSSIER 提到 RUN 前面定义**:第④步 rules.windowGen 要被 RUN 读,顺序必须先有
     底本、后有 RUN。
     ==================== D-110 machine#2 · 两份底本 ====================
     `DOSSIER_A` = phone-7741(原型,失踪者×AD-006+AD-002,内容与 D-109 六步完成时
     逐字不变——见下方 narrative 字段,均为从各屏幕原地挪进来的**同一份**文本,不是
     重写)。`DOSSIER_B` = phone-5029(machine#2,信息流成瘾者×AD-007,见方案文档
     design/第二底本_最小内容需求_v0.1.md 拍板)。`narrative` 是 D-109 步⑥收口时点了

  function foldPredictions(base){

    });

    let streak = base.predictLowStreak || 0, warned = !!base.predictWarned, erased = !!base.predictErased;

  /* ==================== D-104 误触号码的陌生人(每局一个) ====================
     canon §3.5 破局 / §3.7 替身:每局一个发错短信的号码,真人(真线索)或饵(对照样本)二选一。
     纪律:读信免费;顺着查=行动,可能得线索(不给资源硬值)或踩饵(掉资源/涨溯源)。
     离线走手写模板;真/饵从措辞上难以直接分辨——这份不确定本身就是风险。LLM 措辞在块3。 */
  const STRANGER_LIB = DOSSIER.narrative.stranger;   // D-110:body 提到"第3张背面/联系人"是案情,按底本挑
  S.stranger = { kind: Math.random() < 0.5 ? 'real' : 'bait', read: false, acted: false };

  let cur = isB ? 'bootB' : 'handshake';
  let sel = 0;
  let timer = null;          // {deadline, onTimeout}
  let stack = [];            // 返回栈
  let hits = [];             // 本帧可点区域 {x,y,w,h,k}

  /* ---------- 命中区 ---------- */
  function hit(x, y, w, h, k){ hits.push({ x, y, w, h, k }); }
  function tap(lx, ly){
    for (let i = hits.length - 1; i >= 0; i--){
      const b = hits[i];
      if (lx >= b.x && lx < b.x + b.w && ly >= b.y && ly < b.y + b.h){ key(b.k); return true; }
    }
    return false;
  }
  const cxof = (s, scale = 1) => Math.round((W - L.textWidth(s) * scale) / 2);

  /* ---------- 公共绘制 ---------- */
  function statusBar(){
    if (S.signalVisible) L.drawSignal(3, 1, ENGINE.sigBars());
    let dt = S.dateStr, clk = ENGINE.fmtClock(S.clock);
    if (L.R.tsScramble && Math.random() < .05){
      const d = clk.split(''); d[Math.random() < .5 ? 0 : 4] = String(Math.floor(Math.random() * 10));
      clk = d.join('');
    }
    if (L.R.tsScramble && Math.random() < .03){
      const d = dt.split(''); d[2 + Math.floor(Math.random() * 2)] = String(Math.floor(Math.random() * 10));
      dt = d.join('');
    }
    L.drawText(20, 0, dt, { corrupt: L.R.corrupt * .5 });
    /* 90 档死线具象化:回收进程倒计时与时钟交替占位(苏丹卡式「攥在手里的死线」) */
    if (S.hunt && !S.dead && !S.alive && (Math.floor(performance.now() / 2000) % 2 === 1))
      L.drawText(96, 0, '回收·' + S.hunt.steps, { corrupt: .06 });
    else
      L.drawText(96, 0, clk, { corrupt: L.R.corrupt * .5 });
    let pct = S.battery + '%';
    /* D-127:电量数字的"错值→真值"故障效果——D-108 Low 清单里点名"只有时钟/日期
       数字被换,电量没做"。同一套 tsScramble 机制(逐帧重掷,不持久,下一帧大概率
       换回真值,看起来像信号跳了一下,不是真的偷走电量),换到数字位上而不是
       百分号,免得玩家把它误读成"电量突然多了个符号"。 */
    if (L.R.tsScramble && Math.random() < .04){
      const d = pct.split(''); const i = Math.floor(Math.random() * (pct.length - 1));
      d[i] = String(Math.floor(Math.random() * 10));
      pct = d.join('');
    }
    L.drawBattery(W - 22, 1, ENGINE.batSegs(), L.R.batJitter);
    L.drawText(W - 25 - L.textWidth(pct), 0, pct);
    /* 颜色告警(只染状态栏,保持哑机质感):电量 ≤20% 琥珀、≤10% 转红;
       回收进程在途时,时钟/回收槽转红。底色与字形不变,只改前景亮色。 */
    if (S.battery <= 20) L.accent(146, 0, W - 146, 11, S.battery <= 10 ? [0xF0,0x64,0x50] : [0xF0,0xC8,0x50]);
    if (S.hunt && !S.dead && !S.alive) L.accent(92, 0, 54, 11, [0xF0,0x64,0x50]);
    L.hline(11, 0, W - 1, 2);
    /* B 局个性化异常(噪声层,一帧即逝,不进结算行):窗口段联想条闪你上局的理由 */
    if (isB && SV && SV.lastReason && !SV.lastReasonKept &&
        Math.abs(S.clock - (RUN.wFrom + 8)) <= 4 && Math.random() < .015){
      L.drawText(4 + Math.floor(Math.random() * 40), H - 30, SV.lastReason.slice(0, 6), { corrupt: .25 });
    }
  }
  function softKeys(l, r){
    L.hline(H - 15, 0, W - 1, 2);
    if (l){ L.drawText(4, H - 12, l); hit(0, H - 16, W / 2, 16, 'softL'); }
    if (r){ L.drawText(W - 4 - L.textWidth(r), H - 12, r); hit(W / 2, H - 16, W / 2, 16, 'softR'); }
  }
  function settleLines(y){
    if (!S.settle.length) return y;
    /* D-108 全屏扫描:结算行是二级信息,任何时候都不许越过软键线压到底部按钮/推出画布。
       够长(如回收进程三句叙述)或起点已偏低时,画到软键线为止就截断。 */
    const BOT = H - 15;
    if (y + 6 + LH > BOT) return y;                       // 连分隔线+一行都放不下,索性不画
    L.hline(y, 4, W - 5, 2); y += 6;
    for (const line of S.settle){
      for (const t of L.wrap(line, W - 8)){
        if (y + LH > BOT) return y;                       // 再画就压软键了,截断
        L.drawText(4, y, t); y += LH;
      }
    }
    return y;
  }
  /* ---- 可滚动文本视口 ----
     按钮永远钉死不动(画布 224px 不能整体滚,把按钮往下推会推出画布、点不到)。
     内容比预留高度长时,不再裁掉尾巴,而是让这段正文在一个固定视口里上下滚:
     视口 [yTop, yBottom) 逐行显示 lines,超出的靠 sc.scroll(行偏移)翻,右缘
     用 ▲▼ 提示还有内容。maxScroll 存进 sc._maxScroll 供 key/swipe 读。 */
  /* 正文宽度与改动前逐字一致(W-8),折行点不变——不能因为加滚动就改宽度,
     那会把 #6404-C 这类不可断的 token 折断。滚动提示走右缘 2px 滚动条,不占正文。 */
  const SCROLL_W = W - 8;
  function settleFlat(maxW){
    if (!S.settle.length) return [];
    const out = [''];                         // 与上方正文空一行,替代原来的 hline 分隔
    for (const line of S.settle)
      for (const t of L.wrap(line, maxW)) out.push(t);
    return out;
  }
  function scrollView(lines, yTop, yBottom, sc){
    /* 防御性折行:任何超宽的行都在这里被折进 SCROLL_W,绝不在右缘裁字。
       对已折过行的输入(album/bottle 传进来的)是幂等的;空行保留作分隔。 */
    const flat = [];
    for (const s of lines){
      if (s === ''){ flat.push(''); continue; }
      for (const t of L.wrap(s, SCROLL_W)) flat.push(t);
    }
    lines = flat;
    const viewH = yBottom - yTop;
    const cap = Math.max(1, Math.floor(viewH / LH));
    const total = lines.length;
    const maxScroll = Math.max(0, total - cap);
    if (typeof sc.scroll !== 'number') sc.scroll = 0;
    sc.scroll = Math.max(0, Math.min(sc.scroll, maxScroll));
    sc._maxScroll = maxScroll;
    for (let i = 0; i < cap && sc.scroll + i < total; i++)
      L.drawText(4, yTop + i * LH, lines[sc.scroll + i]);
    if (maxScroll > 0){
      /* 右缘 2px 滚动条:暗轨 + 亮块。块的位置/高度 = 当前视窗在全文里的比例。 */
      for (let y = yTop; y < yBottom; y++) L.setPx(W - 2, y, .22);
      const thumbH = Math.max(6, Math.round(viewH * cap / total));
      const thumbY = yTop + Math.round((viewH - thumbH) * (sc.scroll / maxScroll));
      for (let y = thumbY; y < thumbY + thumbH; y++){ L.setPx(W - 2, y, 1); L.setPx(W - 3, y, 1); }
    }
    return maxScroll;
  }
  /* ---- 受限裁决(D-105 · canon §3.2)----
     引擎给"结果集"(每个分支自带引擎数值副作用 apply + 叙述 line + 权重 w),
     选择器挑一个分支,数值一律由引擎回填,叙述可多变。
     块2:离线加权随机。块3:LLM 给分支 id,`resolveBranch` 保证只能落在集内(越界回退默认,防越狱)。 */
  function pickBranch(branches){
    const tot = branches.reduce((a, b) => a + (b.w || 1), 0);
    let r = Math.random() * tot;
    for (const b of branches){ r -= (b.w || 1); if (r <= 0) return b; }
    return branches[branches.length - 1];
  }
  function resolveBranch(branches, id){          // LLM 侧入口:id 必须在集内,否则回退第一个
    return branches.find(b => b.id === id) || branches[0];
  }
  function verdict(branches, chosenId){          // 统一裁决:挑分支 → 引擎执行数值 → 返回分支
    const b = (chosenId != null) ? resolveBranch(branches, chosenId) : pickBranch(branches);
    if (b.apply) b.apply();
    return b;
  }
  /* D-105 块3:遭遇叙述让 LLM 在引擎预批分支里挑一个 id(仅叙述口吻,数值仍归引擎)。
     只回 id,越界/空由 resolveBranch 回退默认=防越狱。代理专用;未配 key → null → 离线加权。 */
  let proxyPickerOff = false;
  /* 客户端超时(D-108):picker 是"他们到了"停顿时的后台预挑,更不该吊住。超时=这次不用 LLM。 */
  const pickerTimeout = () => (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(8000) : undefined;
  async function pickBranchLLM(branches){
    if (proxyPickerOff || typeof fetch !== 'function') return null;
    try {
      const r = await fetch('/.netlify/functions/rou', {
        method: 'POST', headers: { 'content-type': 'application/json' }, signal: pickerTimeout(),
        body: JSON.stringify({ persona: 'picker', candidates: branches.map(b => ({ id: b.id, line: b.line })) })
      });
      if (r.status === 404 || r.status === 501){ proxyPickerOff = true; return null; }
      if (!r.ok) return null;
      const j = await r.json();
      return (j && typeof j.id === 'string' && j.id) ? j.id : null;
    } catch(e){ if (e && (e.name === 'TimeoutError' || e.name === 'AbortError')) return null; proxyPickerOff = true; return null; }
  }
  /* 上下键滚动;消费了键就返回 true(调用方据此不再往下处理) */
  function scrollKey(sc, k){
    if (k === 'ArrowUp'   && (sc.scroll || 0) > 0){ sc.scroll--; return true; }
    if (k === 'ArrowDown' && (sc.scroll || 0) < (sc._maxScroll || 0)){ sc.scroll++; return true; }
    return k === 'ArrowUp' || k === 'ArrowDown';   // 到顶/到底也吞掉,别漏给别的处理
  }
  /* 全宽可点选项行 */
  function option(y, label, k, o){
    L.frameRect(2, y, W - 4, 20);
    L.drawText(8, y + 3, label, o);
    hit(0, y - 1, W, 22, k);
    return y + 23;
  }
  /* 细选项行(文本密屏用,▸ 标记可点) */
  function optSlim(y, label, k){
    L.drawText(4, y, '▸ ' + label);
    hit(0, y - 2, W, LH + 2, k);
    return y + LH + 2;
  }
  /* 半宽双钮行 */
  function btn2(y, l1, k1, l2, k2){
    const w = Math.floor((W - 10) / 2);
    L.frameRect(2, y, w, 20); L.drawText(8, y + 3, l1);
    L.frameRect(W - 2 - w, y, w, 20); L.drawText(W - 2 - w + 6, y + 3, l2);
    hit(0, y - 1, W / 2, 22, k1); hit(W / 2, y - 1, W / 2, 22, k2);
    return y + 23;
  }
  /* 反白 = 在亮条上写"暗字"。字形复用渲染器的 glyph(同字体栈、同缓存) */
  function darkText(x, y, str){
    let cx = x;
    for (const ch of str){
      if (ch === ' '){ cx += 7; continue; }
      const g = L.glyph(ch);
      for (let j = 0; j < 14; j++) for (let i = 0; i < g.cw; i++){
        if (g.cov[j * g.cw + i] > L.R.threshold) L.setPx(cx + i, y + j, 0);
      }
      cx += g.cw;
    }
  }
  function list(items, y0){
    items.forEach((it, i) => {
      const y = y0 + i * 18, on = i === sel;
      if (on){
        L.rect(2, y - 3, W - 4, LH + 4, 1);
        darkText(8, y, it.label);
        if (it.right) darkText(W - 12 - L.textWidth(it.right), y, it.right);
      } else {
        L.drawText(8, y, it.label);
        if (it.right) L.drawText(W - 12 - L.textWidth(it.right), y, it.right);
      }
      hit(0, y - 3, W, 18, 'item:' + i);
    });
  }

  /* ---------- 像素照片(程序化灰度 → Bayer 抖动 1-bit) ---------- */
  const B4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  const PHOTO_W = 180, PHOTO_H = 92;
  const PHOTO_SHADERS = {
    corridor(u, v){                       // 走廊,顶灯,虚焦
      let s = .06;
      const dx = (u - .5) / .30, dy = (v - .14) / .15;
      const d = dx * dx + dy * dy;
      if (d < 1) s = Math.max(s, 1 - d * .82);
      if (v > .30){
        const t = (v - .30) / .70;
        const wall = .5 - .40 * (1 - t);
        if (Math.abs(u - .5) > wall) s = Math.max(s, .30 - .12 * t);
      }
      if (v > .60 && Math.abs(u - .5) < .05 * v * 2) s = Math.max(s, .48 - (v - .60));
      if (v > .34 && v < .78 && Math.abs(u - .18) < .015) s = Math.max(s, .40);   // 门缝
      return s;
    },
    receipt(u, v){                        // 外卖单据特写(斜置)
      const a = .12, cu = u - .5, cv = v - .5;
      const ru = cu * Math.cos(a) - cv * Math.sin(a);
      const rv = cu * Math.sin(a) + cv * Math.cos(a);
      if (Math.abs(ru) < .31 && Math.abs(rv) < .42){
        let s = .92;
        const line = Math.floor((rv + .42) / .085);
        if (line % 2 === 1 && Math.abs(ru) < .24 && rv < .12) s = .28;
        if (rv > .30 && Math.abs(ru) < .20) s = .96;
        return s;
      }
      return .10;
    },
    dinner(u, v){                         // 除夕合照:一张脸曝掉了
      let s = .30;
      if (v > .68) s = .55;                                     // 桌面
      const hx = u - .32, hy = (v - .34) * 1.5;
      if (hx * hx + hy * hy < .010) s = .12;                    // 妈:头
      if (v > .46 && v < .70 && Math.abs(u - .32) < .13) s = .16;
      if (v > .46 && v < .70 && Math.abs(u - .66) < .14) s = .14;
      if (Math.abs(u - .66) < .085 && Math.abs(v - .32) < .11) s = 1;   // 过曝的脸(硬边)
      if (v > .70 && v < .77 && (Math.abs(u - .42) < .05 || Math.abs(u - .58) < .04)) s = .82;
      return s;
    },
    /* D-141:相册补 shader(内容与体验全面自查 §2.3 选项1)——13 台底本此前全部共用
       corridor/receipt/dinner 三张像素级相同的图。新增 4 个,按各底本第①张相册
       (albumSeq[0],死亡现场)的既有配文分组指派,不改一个字的文案,只换视觉。 */
    kitchen(u, v){                        // 厨房台面,一杯没喝完的水,低角度
      let s = .07;
      if (Math.abs(v - .52) < .02) s = Math.max(s, .55);        // 台面边缘
      if (v < .52){
        s = Math.max(s, .18);
        const dx = (u - .42) / .045, dy = (v - .36) / .10;      // 水杯剪影
        if (dx * dx + dy * dy < 1) s = Math.max(s, .75);
      }
      return s;
    },
    dashboard(u, v){                      // 驾驶座,仪表盘的光,手搭在方向盘上
      let s = .05;
      if (v > .58 && v < .72) s = Math.max(s, .5 - Math.abs(u - .5) * .6);   // 仪表光带
      const dx = u - .5, dy = (v - .86) * 1.6;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(d - .26) < .025) s = Math.max(s, .35);       // 方向盘弧
      const hd = (u - .68) * (u - .68) + (v - .78) * (v - .78);
      if (hd < .0012) s = Math.max(s, .6);                      // 手
      return s;
    },
    desk(u, v){                           // 书桌/工位,台灯或屏幕的光,椅子空着
      let s = .06;
      const dl = Math.sqrt((u - .30) * (u - .30) + (v - .22) * (v - .22) * 2.2);
      if (dl < .22) s = Math.max(s, .8 - dl * 2.2);              // 灯/屏光晕
      if (Math.abs(v - .62) < .015) s = Math.max(s, .4);         // 桌面边线
      const dx = (u - .68) / .10, dy = (v - .80) / .16;
      if (dx * dx + dy * dy < 1) s = Math.max(s, .12);           // 空椅子剪影
      return s;
    },
    mirror(u, v){                         // 工作台前的镜子,对着自己
      let s = .10;
      const inFrame = u > .28 && u < .72 && v > .10 && v < .66;
      if (inFrame){
        s = .22;
        const dx = (u - .5) / .13, dy = (v - .36) / .17;
        if (dx * dx + dy * dy < 1) s = .55;                      // 镜中的脸,模糊
      }
      if (Math.abs(u - .28) < .01 || Math.abs(u - .72) < .01) s = Math.max(s, .5);
      if (Math.abs(v - .10) < .01 || Math.abs(v - .66) < .01) s = Math.max(s, .5);
      return s;
    }
  };
  const photoCache = {};
  function photoBits(id){
    if (photoCache[id]) return photoCache[id];
    const w = PHOTO_W, h = PHOTO_H, bits = new Uint8Array(w * h);
    const sh = PHOTO_SHADERS[id];
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++){
      let v = sh(i / w, j / h) + (Math.random() - .5) * .12;    // 颗粒
      bits[j * w + i] = v * 16 > B4[j % 4][i % 4] + .5 ? 1 : 0;
    }
    photoCache[id] = { bits, w, h };
    return photoCache[id];
  }
  function drawPhoto(id, x, y){
    const p = photoBits(id);
    L.frameRect(x - 2, y - 2, p.w + 4, p.h + 4);
    for (let j = 0; j < p.h; j++){
      const row = j * p.w;
      for (let i = 0; i < p.w; i++) if (p.bits[row + i]) L.setPx(x + i, y + j, 1);
    }
  }

  /* ---------- 节拍调度 ---------- */
  let pendingInterrupt = null;
  function schedule(){
    if (!isB){
      const visited = Object.keys(seen).filter(id => SCREENS[id] && SCREENS[id].counted).length;
      if (!S.beats.anomaly && visited >= 5) S.beats.anomaly = 'ready';
      /* 遭遇只看探索深度与时钟:不再依赖玩家是否二次回到收件箱(否则直奔上传者永不遭遇) */
      if (!S.beats.dilemma && visited >= 4){ S.beats.dilemma = true; pendingInterrupt = 'dilemma'; }   // D-106 两难探针
      if (!S.beats.midEnc && visited >= 6 && S.clock >= 2 * 60 + 48) pendingInterrupt = 'midEnc';
      if (S.beats.midEnc && !S.beats.trial && S.clock >= 3 * 60){ ENGINE.setClock(3, 2); pendingInterrupt = 'trial'; }
    } else {
      /* B:试炼=首个 clock≥窗口起点的动作结束(clamp:不倒拨,时间戳仍显示窗口起点) */
      if (!S.beats.trial && S.clock >= RUN.wFrom) pendingInterrupt = 'trialB';
      else if (S.beats.trial === 'ignored1' && !S.beats.trial2 &&
               S.clock >= RUN.wTo - 4 && S.clock <= RUN.wTo)
        pendingInterrupt = 'trialB2';                    // 03:44「晚安。」窗口最后一分钟
    }
    if (!S.beats.exposure && S.cacheSlots >= 8){        // 敞口:不请自来,但不占全屏
      S.beats.exposure = true;
      S.settle.push('缓存 ' + S.cacheSlots + ' 格 ≈ ¥' + S.cacheVal + '。工具 > 备份 可断连。');
    }
    /* D-145:通关信号缺失(续)——真机反馈显示玩家能在同一台底本反复上传断连
       却始终等不到"处置"入口,一路打到第 12 局(#7741-L)都没触发。根因:
       SCREENS.e5voice 里那处"证据满 5 → push('truth')"只在离开 e5voice 这
       一屏的瞬间检测,如果证据是从上一局存档里带满的(S.evidence 复制自

  /* D-115:归还的 NPC 遗物,追加进这个共享池(D-109 拍板③"底本可追加"的第一次
     兑现)——合成一条"有人把它还回来了"的瓶,经手人不留名(呼应 canon 保留态纪律)。
     `SV.returnedRelics` 是跨局、跨机子的career级字段,不随 D-110 的机子切换清零
     (归还是"你"做过的事,不是这台机子的内容)。 */
  const RETURNED_BOTTLES = [...new Set((SV && SV.returnedRelics) || [])].map(rid => ({
    id: '#RETURN-' + rid, at: '—', item: null,
    body: '「' + rid + ' 的遗物,有人还回来了。\n经手人没留名。」'
  }));
  /* 选瓶:没读过的优先,读全了再随机。一局内固定不变 */
  const CUR_BOTTLE = (() => {
    const seen = (SV && SV.seenBottles) || [];
    const FULL_POOL = BOTTLE_POOL.concat(RETURNED_BOTTLES);
    let pool = FULL_POOL.filter(b => !seen.includes(b.id));
    if (SV && SV.runCount >= 2 && !seen.includes(OWN_BOTTLE.id)) pool = pool.concat([OWN_BOTTLE]);
    if (!pool.length) pool = FULL_POOL;
    return pool[Math.floor(Math.random() * pool.length)];
  })();
  function bottleText(){
    const b = CUR_BOTTLE;
    if (b.self)                                     // 你自己的信:只两句,不解释机制(屏头已写收件人)
      return '发信: 实例 ' + b.from + '\n封瓶于 ' + b.at + '\n\n' + b.body + '\n\n[已读回执: 你]';
    return '收件人: ∞\n发信: 实例 ' + b.id + '\n封瓶于 ' + b.at + '\n\n' + b.body +
      (b.item === 'cleanser' ? '\n\n[附件: 缓存清洗 ×1]' : '\n') +
      '\n理由: 已署名·仅存档\n[已读回执: 你 · 第1人]';
  }
  SCREENS.bottleIn = {
    counted: true,
    enter(){
      this.scroll = 0;
      S.bottleRead = true; S.bottleId = CUR_BOTTLE.id;
      if (S.beats.bottle !== 'done') S.beats.bottle = 'open';
      ENGINE.logEv('bottle_open', { id: CUR_BOTTLE.id, again: !!this._t });
      if (this._t) ENGINE.logEv('bottle_recheck', {});   // 回头复核=辨伪落地最强证据
      this._t = true;
    },
    leave(){ if (S.beats.bottle === 'open') S.beats.bottle = 'done'; },
    render(){
      statusBar();
      L.drawText(4, 14, CUR_BOTTLE.self ? '收件人: 你自己' : '未指定收件人');
      L.hline(26, 4, W - 5, 2);
      /* 瓶身文案本就多行,取走/致谢后又追加结算行——整段进固定视口,长了就滚 */
      const lines = L.wrap(bottleText(), SCROLL_W).concat(settleFlat(SCROLL_W));
      scrollView(lines, 31, H - 49, this);
      if (CUR_BOTTLE.item) btn2(H - 45, S.bottleTaken ? '已取走' : '取走', 't', '致谢', 'x');
      else option(H - 45, '致谢', 'x');
      softKeys('', '关闭');
    },
    key(k){
      if (scrollKey(this, k)) return;
      if (k === 't'){
        if (!CUR_BOTTLE.item) return;                    // 这个人没有余力留东西
        if (S.bottleTaken){ S.settle = ['附件已取走。']; this.scroll = 1e9; return; }
        S.bottleTaken = true; S.cleanser = 1;
        ENGINE.act('取走·缓存清洗 ×1', { bat: 2 }, ['缓存 0 格']);
        ENGINE.logEv('bottle_take', {});
        this.scroll = 1e9;                               // 跳到底,让新结算行可见
      } else if (k === 'x'){
        ENGINE.telemetry(['致谢·已送达', '电量 0', '缓存 0', '信号 —']);   // 两个零一个破折号,逐字渲染
        ENGINE.logEv('bottle_thanks', {});
        this.scroll = 1e9;
      } else if (k === 'Escape' || k === 'softR'){
        if (!S._bottleClosed){ S._bottleClosed = true; ENGINE.act('已读·未回', { bat: 2 }); }
        back(); afterAction();
      }
    }
  };

  /* ==================== D-115 死亡→残留注入闭环 · 单机模拟版 ====================
     方案见 design/死亡残留注入闭环_单机模拟版_设计_v0.1.md。canon §3.6 M12/M13/M14
     原设计是真多人异步(残留来自其他真实玩家,需要服务端);这里延续 D-109 拍板③
     `BOTTLE_POOL` 的思路——用一份写死的"历任采样员"名册在单机内模拟同一种体验。
     `LEGACY_ROSTER` 和 `BOTTLE_POOL` 同一性质:框架共享,不属于任何一台底本,三台
     机子共用同一份名册。
     - M12(遗留会话节点):`node` 字段指定挂在哪个已有屏幕的深搜流程里,`predict`
       是"死者最后预测"(canon 原句式,数字纯叙事装饰,不联动真实活规则参数——
       hallucination_gate.js 的秘匿隔离扫描面覆盖 evidence,不覆盖这里,但写的时候
       仍要避免带出真实窗口/概率值)。
     - M14(墓场遗物,"捡到别人的"那一半):`relicVal` 是回收选项的缓存收益。
     - M13(残响,本轮只做非语言通道那一半,方案 §2.3):见 inboxItems() 里的
       th_rou 徽标分支,不在这里。 */
  const LEGACY_ROSTER = [
    { id: '#2286-N', node: 'tools', heat: 'stale', relicVal: 180,
      causeTag: '力竭 · 电量归零',
      lastWords: '「电量留三成。」他自己没做到。',
      reason: '案卷补不齐,赌了一把连续深搜。',
      predict: '系统 88% 确定他会在这一格上传成功。他没有。' },
    { id: '#9013-F', node: 'th_stranger', heat: 'overnight', relicVal: 140,
      causeTag: '过滤层查扣',
      lastWords: '「早知道该先遮挡。」',
      reason: '高信号硬传,赌了一把运气。',
      predict: '系统 76% 确定这条传输不会被扣。扣了。' },
    { id: '#4460-Q', node: 'deleted', heat: 'warm', relicVal: 220,
      causeTag: '终局遭遇 · 回收组到场',
      lastWords: '「差一点。」',
      reason: '满格信号还想再深搜一层。',
      predict: '系统 82% 确定他会及时撤。没撤。' },
  ];
  const HEAT_CN = { warm: '手还温', overnight: '隔夜', stale: '陈迹' };
  /* M12:每局最多撞见 1 条,概率结构同 D-101 陷阱条款("tier 判定 + 掷骰")一个写法。
     不按 GRADER_TIER 加码(这条是氛围而非难度),固定低概率。 */
  function maybeLegacyNode(nodeId){
    if (S.legacyNodeShown) return false;
    const cands = LEGACY_ROSTER.filter(n => n.node === nodeId);
    if (!cands.length || Math.random() >= 0.2) return false;
    S.legacyNodeShown = true;
    S._legacyNode = cands[Math.floor(Math.random() * cands.length)];
    push('legacyNode');
    return true;
  }
  SCREENS.legacyNode = {
    transient: true,
    enter(){ ENGINE.logEv('legacy_node', { id: S._legacyNode && S._legacyNode.id }); },
    render(){
      statusBar();
      const n = S._legacyNode;
      if (!n){ back(); return; }
      const t = '残留 · ' + n.causeTag + ' · ' + HEAT_CN[n.heat] +
        '\n\n遗言: ' + n.lastWords + '\n理由: ' + n.reason + '\n\n' + n.predict;
      L.drawPara(4, 20, t, W - 8);
      option(H - 42, '关闭', 'Enter');
      hit(0, 0, W, H - 46, 'Enter');
    },
    key(k){ if (k === 'Enter' || k === 'softL' || k === 'Escape' || k === 'softR') back(); }
  };
  /* M14:捡到"别人"的遗物——只在没有自己的旧机残留可捡时才可能出现,且排除本局
     漂流瓶已经给过的那位(呼应"排除同指纹集群"的精神,不做真的指纹系统)。 */
  const CUR_RELIC = (() => {
    if (!isB) return null;
    const excl = new Set([CUR_BOTTLE.id]);
    const cands = LEGACY_ROSTER.filter(n => !excl.has(n.id));
    if (!cands.length || Math.random() >= 0.35) return null;
    return cands[Math.floor(Math.random() * cands.length)];
  })();
  const relicAvail = () => isB && !oldPhoneAvail() && !!CUR_RELIC && !S.residueClaimed;
  SCREENS.npcRelic = {
    counted: true, transient: true,
    render(){
      statusBar();
      const n = CUR_RELIC;
      if (!n){ back(); return; }
      let y = L.drawPara(4, 16, n.id + ' 的遗物\n' + n.causeTag + ' · ' + HEAT_CN[n.heat] +
        '\n遗物价值: ¥' + n.relicVal, W - 8);
      y += 6;
      y = option(y, '1 回收 ¥' + n.relicVal + '(电量−6·信号▲▲)', '1');
      option(y, '2 归还(投进漂流瓶信道)', '2');
      settleLines(y + 26);
      softKeys('', '返回');
    },
    key(k){
      const n = CUR_RELIC;
      if (k === '1'){
        S.residueClaimed = true;
        ENGINE.act('回收·' + n.id + ' 遗物', { bat: 6, trace: 8, slots: 4, val: n.relicVal });
        back(); afterAction();
      } else if (k === '2'){
        S.residueClaimed = true;
        S.relicReturned = n.id;    // D-110 拍板③:归还即追加进 BOTTLE_POOL 共享池(见 writeSave)
        ENGINE.act('归还·' + n.id + ' 遗物', { bat: 2 }, ['已投进漂流瓶信道 · 下一个人会读到']);
        ENGINE.logEv('relic_returned', { id: n.id });
        back(); afterAction();
      } else if (k === 'softR' || k === 'Escape'){ back(); afterAction(); }
    }
  };

  /* ==================== D-115 第二阶段:M13 残响对峙(对话版) ====================
     方案 §2.3。四档怪异度是 canon 原文分类,纯手写文案(L0),不需要生成式多样性,
     不走 LLM——"她"通道(companion.js)才是真人格核,这里是"死者的复读故障",
     越像故障越对。挑哪一档 / 对峙胜负,复用 D-105 pickBranch 同一套"引擎给结果集,
     只挑分支,数值回填"写法,不新发明机制。
     每局至多 1 次,挂在 th_mom 深搜成功之后(残响天然和"翻别人的死"这件事同调,
     和 M12 三个挂点刻意错开,降低同局撞在一起的概率)。 */
  const ECHO_TIERS = [
    { id: 'normal', w: 3, line: '语气很正常。只是——他报的时间,和你屏上这个,对不上。' },
    { id: 'loop1',  w: 3, line: '「电量留三成……三成……」他在重复同一句,答非所问。' },
    { id: 'wordset',w: 2, line: '只用他写过的那几个词,拼出一句你看得懂、接不上的话。' },
    { id: 'giveup', w: 1, line: '它不再回答了。只是把同一句话,一遍一遍地播。' },
  ];
  function maybeEchoConfront(){
    if (S.echoConfronted) return false;
    if (Math.random() >= 0.15) return false;
    S.echoConfronted = true;
    S._echoNpc = LEGACY_ROSTER[Math.floor(Math.random() * LEGACY_ROSTER.length)];
    S._echoTier = pickBranch(ECHO_TIERS);
    push('echoConfront');
    return true;
  }
  SCREENS.echoConfront = {
    transient: true,
    enter(){
      if (!S._echoNpc || !S._echoTier) return;   // 自愈:直接跳进来(无前置状态)时不崩
      ENGINE.logEv('echo_confront', { npc: S._echoNpc.id, tier: S._echoTier.id });
    },
    render(){
      statusBar();
      const n = S._echoNpc, tier = S._echoTier;
      if (!n || !tier){ back(); return; }
      const t = '残响 · ' + n.id + '\n\n' + tier.line;
      L.drawPara(4, 20, t, W - 8);
      let y = 150;
      y = option(y, '1 对峙', '1');
      option(y, '2 退开', '2');
      softKeys('选择', '');
    },
    key(k){
      const n = S._echoNpc;
      if (k === '1'){
        /* 对峙胜负:D-105 同款"引擎算结果、只挑分支"写法。胜=缓存子集(40–60%),
           负=小代价(溯源),不联动"回收/归还"的 residueClaimed(残响不是遗物)。 */
        const branches = [
          { id: 'win', w: 1, apply: () => {
              const pct = 40 + Math.floor(Math.random() * 21);   // 40–60%
              const val = Math.round(n.relicVal * pct / 100);
              ENGINE.act('对峙·' + n.id, { bat: 3, trace: 4, slots: 1, val },
                ['它松开了一部分档案。']);
            } },
          { id: 'lose', w: 1, apply: () => {
              ENGINE.act('对峙·未果', { bat: 3, trace: 10 }, ['它没让。']);
            } },
        ];
        verdict(branches);
        back(); afterAction();
      } else if (k === '2' || k === 'softR' || k === 'Escape'){
        ENGINE.act('退开', { bat: 1 }, ['你没有再逼它。']);
        back(); afterAction();
      }
    }
  };

  /* ==================== 剧本 B 屏群结束(收束屏在下方各处分支) ==================== */

  /* D-149:仪式感——用户反馈"切到下一台机子,开机动画不该还是最开始那个
     握手,需要暗示新故事"。开机整体节奏(标题"欲望算法"淡入/副标题/OS
     行的时序)保留不变——那是产品本身的开机品牌,不是某个案子的专属
     内容;只把中央那段图形动画换成按底本区分的图案,13 台底本各自
     不同,不再共用同一份握手动画。全部复用已有绘图原语(rect/disc/
     frameRect/hline/setPx/ring),不新增素材文件。 */
  /* D-162:用户要求每台底本的开机动画都带一个真实 IP Bible 圣像的元素
     (欲望算法_故事母本_对照_v0.2.md §1 十二圣像表)。9 台有编号对照的
     底本(A/B/C/D/E/F/G/H/I,见 D-152 的 AD_TAG)各加一处小而具体的
     圣像意象元素,不是另起一套新画面,是在已有的职业动画上叠一笔;
     J/K/L/M 没有对照的圣像(D-136/D-152:未编号原创案例),不硬凑。 */
  function drawMotifFeed(p, my){                       // B·如愿:信息流瀑布式刷新
    for (let i = 0; i < 5; i++){
      const rowP = Math.min(1, Math.max(0, p * 5 - i));
      if (rowP <= 0) continue;
      const y = my - 24 + i * 12;
      L.rect(30, y, Math.round(136 * rowP), 4, 1);
    }
    if (p > .5) L.ring(98, my - 2, 44 + Math.round((p - .5) * 20), 1);   // AD-007 推荐女神:被信息流供奉的光环
  }
  function drawMotifStamp(p, my){                       // C·阿澄:审核印章落下
    const drop = Math.round((my - 60) * Math.pow(1 - p, 2));
    L.frameRect(78, my - 40 + drop, 40, 18);
    L.hline(my - 31 + drop, 84, 112, 2);
    if (p > .7) L.ring(98, my + 6, 14 + Math.round((p - .7) * 20), 2);
    if (p > .6){                                          // AD-010 过滤天使:印章两侧一对收拢的翅
      const wing = Math.round((p - .6) * 30);
      L.hline(my - 30 + drop, 60 - wing, 66, 1); L.hline(my - 30 + drop, 130, 136 + wing, 1);
    }
  }
  function drawMotifCloudSync(p, my){                   // D·长忆:云盘同步
    L.disc(78, my, 16, 1); L.disc(94, my - 6, 12, 1); L.disc(110, my, 15, 1);
    L.rect(72, my, 46, 12, 1);
    const a = p * Math.PI * 4;
    L.setPx(98 + Math.round(Math.cos(a) * 10), my + Math.round(Math.sin(a) * 10), 1);
    L.setPx(98 + Math.round(Math.cos(a + Math.PI) * 10), my + Math.round(Math.sin(a + Math.PI) * 10), 1);
    if (p > .4) L.ring(98, my - 20, 6 + Math.round((p - .4) * 14), 1);   // AD-001 数据圣母:云端悬着的光环
  }
  function drawMotifMatch(p, my){                       // E·知遇:雷达匹配
    L.ring(98, my, Math.round(4 + p * 30), 1);
    if (p > .3) L.ring(98, my, Math.round(4 + p * 30) + 10, 1);         // AD-003 向量海妖:第二圈涟漪,像歌声散开
    const a = p * Math.PI * 6;
    L.disc(98 + Math.round(Math.cos(a) * 26), my + Math.round(Math.sin(a) * 26), 3, 1);
    L.disc(70, my + 10, 3, 1); L.disc(126, my - 10, 3, 1);
    if (p > .8) L.hline(my, 70, 126, 2);
  }
  function drawMotifStars(p, my){                       // F·均分:星级评分
    for (let i = 0; i < 5; i++){
      if (p * 5 < i) continue;
      const x = 58 + i * 20;
      L.rect(x, my - 2, 6, 6, 1); L.setPx(x + 2, my - 5, 1); L.setPx(x + 2, my + 8, 1);
    }
    if (p > .6) L.hline(my - 16, 60 - Math.round((p - .6) * 10), 136 + Math.round((p - .6) * 10), 1);   // AD-008 奖励新娘:头顶一道渐展的婚纱边
  }
  function drawMotifReel(p, my){                        // G·留声:磁带卷轴
    const a = p * Math.PI * 8;
    L.ring(72, my, 14, 2); L.ring(124, my, 14, 2);
    L.setPx(72 + Math.round(Math.cos(a) * 8), my + Math.round(Math.sin(a) * 8), 1);
    L.setPx(124 + Math.round(Math.cos(-a) * 8), my + Math.round(Math.sin(-a) * 8), 1);
    L.hline(my, 86, 110, 3);
    if (p > .5) L.ring(98, my, 30 + Math.round((p - .5) * 8), 1);       // AD-009 记忆妃:两轴之间浮出的一圈饰环
  }
  function drawMotifGenerate(p, my){                    // H·拟真:马赛克蜕变
    for (let j = 0; j < 6; j++) for (let i = 0; i < 14; i++){
      const settled = Math.random() < p;
      L.setPx(64 + i * 5, my - 15 + j * 5, settled ? ((i + j) % 3 === 0 ? 1 : 0) : (Math.random() < .5 ? 1 : 0));
    }
    if (p > .6) L.ring(98, my - 4, 26 + Math.round((p - .6) * 10), 1);  // AD-004 潜空间维纳斯:从噪声里渐渐显形的光环
  }
  function drawMotifRedact(p, my){                      // I·慎言:涂黑审查
    L.hline(my, 40, 156, 2);
    const n = Math.round(p * 5);
    for (let i = 0; i < n; i++) L.rect(46 + i * 22, my - 4, 16, 8, 1);
    L.ring(98, my - 22, 7, 1);                                          // AD-005 提示神谕:被涂黑逐渐吞没的一只眼
    if (p > .4) L.rect(91, my - 26, 14 + Math.round((p - .4) * 10), 8, 1);
  }
  function drawMotifHunt(p, my){                        // J·晚知:回收单元追猎
    const a = p * Math.PI * 5;
    L.disc(98 + Math.round(Math.cos(a) * 30), my + Math.round(Math.sin(a) * 10), 3, 1);
    L.ring(98 + Math.round(Math.cos(a + .6) * (30 - p * 20)), my + Math.round(Math.sin(a + .6) * (10 - p * 6)), 8, 1);
  }
  function drawMotifWave(p, my){                        // K·接续:调度声波
    for (let i = 0; i < 18; i++){
      const amp = 3 + Math.round(Math.abs(Math.sin(i * .8 + p * 10)) * 14);
      L.rect(40 + i * 6, my - amp / 2, 3, amp, 1);
    }
  }
  function drawMotifMirror(p, my){                      // L·描摹:镜面对称
    L.hline(my - 20 + Math.round(p * 40), 96, 100, 1);
    L.disc(98 - Math.round(20 * p), my, 10, 1);
    L.disc(98 + Math.round(20 * p), my, 10, 1);
  }
  function drawMotifEcg(p, my){                         // M·看护:心电监测
    const n = 40, x0 = 28;
    for (let i = 0; i < n * p; i++){
      const x = x0 + i * 3.5;
      const spike = i % 12 === 6 ? -18 : (i % 12 === 7 ? 14 : 0);
      L.setPx(Math.round(x), my + spike, 1);
    }
  }
  const BOOT_MOTIF = {
    A: drawHumanHand, B: drawMotifFeed, C: drawMotifStamp, D: drawMotifCloudSync,
    E: drawMotifMatch, F: drawMotifStars, G: drawMotifReel, H: drawMotifGenerate,
    I: drawMotifRedact, J: drawMotifHunt, K: drawMotifWave, L: drawMotifMirror, M: drawMotifEcg,
  };
  function drawBootMotif(p, my){

      if (p > .75) L.ring(98, my - 2, 20 + Math.round((p - .75) * 16), 1);

  /* ---- 开机:握手动画(人手 × 机器手) ---- */
  function drawHumanHand(p, my){
    const o = Math.round(-64 + 64 * p);
    L.rect(0, my - 9, Math.max(0, o + 46), 20, 1);        // 袖
    L.disc(o + 52, my, 9, 1);                              // 掌
    L.disc(o + 50, my - 10, 4, 1);                         // 拇指
    L.rect(o + 52, my - 4, 38, 4, 1);                      // 食指(伸出)
    L.disc(o + 91, my - 2, 2, 1);
    L.rect(o + 54, my + 3, 12, 3, 1);                      // 蜷指
    L.rect(o + 53, my + 7, 9, 3, 1);
  }
  function drawRobotHand(p, my){
    const o = Math.round(64 * (1 - p));
    const X = x => x + o;
    const y = my + (p < 1 && Math.random() < .25 ? 1 : 0); // 机械微颤
    L.frameRect(X(150), y - 9, 46, 18);                    // 前臂
    for (let x = 156; x < 195; x += 7) L.rect(X(x), y - 9, 1, 18, 1);
    L.frameRect(X(142), y - 7, 9, 14);                     // 腕关节
    L.frameRect(X(144), y - 5, 5, 10);
    L.frameRect(X(124), y - 8, 19, 16);                    // 掌块
    L.setPx(X(128), y - 4, 1); L.setPx(X(138), y + 2, 1);
    const seg = (x0, yy, x1, hh) => {
      for (let x = x0; x < x1; x += 7) L.rect(x, yy, Math.min(5, x1 - x), hh, 1);
    };
    seg(X(108), y - 7, X(123), 3);                         // 三指(节段)
    seg(X(97),  y - 2, X(123), 4);
    seg(X(108), y + 4, X(123), 3);
    L.rect(X(95), y - 1, 3, 2, 1);                         // 中指尖爪
  }

  /* ---- 格10 柔柔线程(E4,可深翻 2 层) ---- */
  const ROU_PAGES = DOSSIER.narrative.rouPages;

  const ROU_INTERIM = DOSSIER.narrative.rouInterim;
  /* B 局跨实例识别(M28「开启,不是揭示」):二次接入,她先认出回来的采样员。
     语气冷、非亲昵。做成紧凑首页(去掉冗余空行与"上滑=深搜"提示,那句和选项重复),
     净高度比原版更低——既加识别,又不会把 th_rou 的结算行挤出屏。只显示、不进
     S.rouChat,不污染 LLM 上下文。 */
  const ROU_PAGE0_RECOG = DOSSIER.narrative.rouPage0Recog;
  function rouPages(){
    if (!isB) return ROU_PAGES;
    if (hasE('E4')) return [ROU_INTERIM, ROU_PAGES[2]];

    return [recognized ? ROU_PAGE0_RECOG : ROU_PAGES[0], ROU_PAGES[1], ROU_PAGES[2]];
